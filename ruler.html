<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>接尺測試（體驗版）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0b0e; color: #eee; font-family: "Segoe UI","Microsoft JhengHei",sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px 0 30px; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: #bbb; margin: 0 0 4px; }
  .sub { color: #666; font-size: 12px; margin-bottom: 10px; }
  .stage { position: relative; width: min(320px, 88vw); height: 440px; background: #15151a; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px #000; cursor: pointer; touch-action: none; }
  .hand { position: absolute; left: 50%; top: 300px; width: 150px; height: 60px; transform: translateX(-50%); }
  .hand div { position: absolute; top: 0; width: 46px; height: 60px; border-radius: 10px; background: #f1c8a0; }
  .hand .l { left: 0; } .hand .r { right: 0; }
  .ruler { position: absolute; left: 50%; width: 44px; height: 420px; transform: translateX(-50%); background: #f5d57a; border-radius: 4px; top: -420px; border: 2px solid #c9a94a; will-change: top; transition: opacity .2s; }
  .ruler i { position: absolute; left: 0; height: 2px; background: #6b5620; }
  .ruler b { position: absolute; right: 6px; font-size: 9px; color: #4a3a10; transform: translateY(-5px); font-style: normal; }
  .msg { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 18px; color: #888; }
  .res { position: absolute; left: 0; right: 0; top: 110px; text-align: center; }
  .res .box { display: inline-block; background: #0b0b0ee6; padding: 14px 22px; border-radius: 14px; }
  .stage.done .ruler { opacity: .25; }
  .res .big { font-size: 56px; font-weight: 800; color: #3ddc84; line-height: 1; }
  .res .ms { font-size: 20px; color: #ccc; margin-top: 6px; }
  .res .g { font-size: 14px; color: #888; margin-top: 8px; }
  .bad { color: #ff5252 !important; }
  .hint { margin-top: 12px; color: #666; font-size: 13px; width: min(320px, 88vw); text-align: center; line-height: 1.6; }
  .hist { margin-top: 10px; color: #888; font-size: 13px; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
</style>
</head>
<body>
  <h1>接尺測試</h1>
  <div class="sub">體驗版・手指放在尺的兩側，尺掉下來立刻捏住</div>
  <div class="stage" id="stage">
    <div class="msg" id="msg">點一下畫面準備</div>
    <div class="ruler" id="ruler"></div>
    <div class="hand"><div class="l"></div><div class="r"></div></div>
    <div class="res" id="res"></div>
  </div>
  <div class="hist" id="hist">本次：--　平均：--　次數：0</div>
  <div class="hint">公式：距離 = ½ × g × t²，所以 t = √(2d / g)。<br>一般人 15–20 cm（約 0.17–0.20 秒），很快 10 cm 以下（0.14 秒）。<br>尺在你手指位置從 0 開始，掉到哪裡就是幾公分。</div>
  <div class="sig">Generated by Gary Fan</div>
<script>
const stage = document.getElementById('stage'), ruler = document.getElementById('ruler'), msg = document.getElementById('msg'), res = document.getElementById('res');
const PX_PER_CM = 10;            // 1 cm = 10px（尺 420px = 42 cm）
const HAND_Y = 330;              // 手指位置（尺的 0 cm 要對齊這裡）
const G = 980;                   // cm/s²
let state = 'idle', t0 = 0, raf = 0, timer = 0, hist = [];
// 畫刻度
for (let cm = 0; cm <= 42; cm++) {
  const i = document.createElement('i'); i.style.bottom = (cm * PX_PER_CM) + 'px'; i.style.width = cm % 5 === 0 ? '22px' : cm % 1 === 0 ? '10px' : '6px'; ruler.appendChild(i);
  if (cm % 5 === 0 && cm > 0) { const b = document.createElement('b'); b.style.bottom = (cm * PX_PER_CM) + 'px'; b.textContent = cm; ruler.appendChild(b); }
}
// 尺底部（0 cm）對齊手指：ruler 高 420，top = HAND_Y - 420 → 0cm 在手指處
const TOP0 = HAND_Y - 420;
function reset() { cancelAnimationFrame(raf); clearTimeout(timer); ruler.style.top = TOP0 + 'px'; res.innerHTML = ''; stage.classList.remove('done'); }
function arm() {
  reset(); state = 'armed'; msg.textContent = '準備…尺隨時會掉';
  timer = setTimeout(() => {
    state = 'falling'; t0 = performance.now(); msg.textContent = '';
    const loop = () => {
      const t = (performance.now() - t0) / 1000;
      const d = 0.5 * G * t * t;                 // cm
      ruler.style.top = (TOP0 + d * PX_PER_CM) + 'px';
      if (d >= 42) { finish(null); return; }      // 掉出手外
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }, 1000 + Math.random() * 2500);
}
function finish(ms) {
  cancelAnimationFrame(raf); state = 'result'; stage.classList.add('done');
  if (ms == null) { res.innerHTML = '<div class="box"><div class="big bad">沒接到</div><div class="g">尺掉出手外（超過 42 cm）。點畫面再試</div></div>'; msg.textContent = ''; return; }
  const t = ms / 1000, d = 0.5 * G * t * t;
  hist.push(ms);
  const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
  res.innerHTML = `<div class="box"><div class="big">${d.toFixed(1)}<span style="font-size:22px"> cm</span></div><div class="ms">${t.toFixed(3)} 秒</div><div class="g">${grade(ms)}・點畫面再試</div></div>`;
  document.getElementById('hist').textContent = `本次：${t.toFixed(3)}s　平均：${(avg / 1000).toFixed(3)}s　次數：${hist.length}`;
}
function grade(ms) { return ms < 120 ? '預判或運氣' : ms < 150 ? '職業級' : ms < 180 ? '很快' : ms < 220 ? '一般人' : ms < 280 ? '慢半拍' : '還在看尺'; }
stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'idle' || state === 'result') { arm(); return; }
  if (state === 'armed') { reset(); state = 'result'; stage.classList.add('done'); res.innerHTML = '<div class="box"><div class="big bad">太早了</div><div class="g">尺還沒掉就捏。點畫面再試</div></div>'; msg.textContent = ''; return; }
  if (state === 'falling') finish(performance.now() - t0);
});
reset();
</script>
</body>
</html>
