<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>接尺測試（體驗版）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0b0e; color: #eee; font-family: "Segoe UI","Microsoft JhengHei",sans-serif; display: flex; flex-direction: column; align-items: center; padding: 14px 0 30px; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: #bbb; margin: 0 0 4px; }
  .sub { color: #666; font-size: 12px; margin-bottom: 8px; }
  .teams { display: flex; gap: 8px; margin-bottom: 10px; }
  .teams button { border: 2px solid #333; background: #15151a; color: #aaa; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; font-family: inherit; }
  .teams button.on { border-color: var(--c); color: var(--c); }
  .stage { position: relative; width: min(320px, 88vw); height: 460px; background: #15151a; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px #000; cursor: pointer; touch-action: none; }
  .glove { position: absolute; left: 50%; bottom: 0; width: 300px; transform: translateX(-50%) translateX(28px); pointer-events: none; }
  .ruler { position: absolute; left: 0; width: 36px; background: #f5d57a; border-radius: 4px; border: 2px solid #c9a94a; will-change: top; transition: opacity .2s; height: 420px; top: -420px; }
  .ruler i { position: absolute; left: 0; height: 2px; background: #6b5620; }
  .ruler b { position: absolute; right: 5px; font-size: 9px; color: #4a3a10; transform: translateY(-5px); font-style: normal; }
  .stage.done .ruler { opacity: .3; }
  .msg { position: absolute; left: 150px; right: 12px; top: 14px; text-align: center; font-size: 16px; color: #888; line-height: 1.4; }
  .res { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
  .res .box { display: inline-block; background: #0b0b0ee6; padding: 14px 22px; border-radius: 14px; }
  .res .big { font-size: 56px; font-weight: 800; color: #3ddc84; line-height: 1; }
  .res .ms { font-size: 20px; color: #ccc; margin-top: 6px; }
  .res .g { font-size: 14px; color: #888; margin-top: 8px; }
  .bad { color: #ff5252 !important; }
  .hint { margin-top: 12px; color: #666; font-size: 13px; width: min(320px, 88vw); text-align: center; line-height: 1.6; }
  .hist { margin-top: 10px; color: #888; font-size: 13px; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
</style>
</head>
<body>
  <h1>接尺測試</h1>
  <div class="sub">體驗版・尺垂在拇指與食指之間，掉下來立刻捏住</div>
  <div class="teams" id="teams"></div>
  <div class="stage" id="stage">
    <div class="msg" id="msg">點一下畫面準備</div>
    <div class="ruler" id="ruler"></div>
    <div class="glove" id="glove"></div>
    <div class="res" id="res"></div>
  </div>
  <div class="hist" id="hist">本次：--　平均：--　次數：0</div>
  <div class="hint">公式：距離 = ½ × g × t²，所以 t = √(2d / g)。<br>一般人 15–20 cm（約 0.17–0.20 秒），很快 10 cm 以下（0.14 秒）。</div>
  <div class="sig">Generated by Gary Fan</div>
<script>
// ===== 車隊配色（與主站一致） =====
const CARS = [
  { id: 'redbull',  en: 'RED BULL', body: '#121f4e', accent: '#e10600', accent2: '#ffd300', label: '#e10600' },
  { id: 'ferrari',  en: 'FERRARI',  body: '#e8002d', accent: '#ffffff', accent2: '#ffd300', label: '#e8002d' },
  { id: 'mclaren',  en: 'McLAREN',  body: '#ff8000', accent: '#1a1a1a', accent2: '#47c7fc', label: '#ff8000' },
  { id: 'mercedes', en: 'MERCEDES', body: '#16181c', accent: '#00a19c', accent2: '#c0c4c8', label: '#00a19c' },
];
// ===== 賽車手套：掌心朝前、五指朝上、拇指往左張開，尺垂在拇指與食指之間 =====
function gloveSVG(c) {
  const base = c.body, pad = c.accent === '#ffffff' ? c.accent2 : c.accent, cuff = c.label, seam = c.accent2;
  const edge = c.id === 'mercedes' || c.id === 'redbull' ? '#9a9ea8' : '#00000055';
  const f = (x, w, top) => `<rect x="${x}" y="${top}" width="${w}" height="${150 - top}" rx="${w / 2}" fill="${base}" stroke="${edge}" stroke-width="1.6"/>`;
  return `<svg viewBox="0 0 240 270" xmlns="http://www.w3.org/2000/svg">
    <!-- 拇指：大幅往左張開，指尖 (22,98) 當作 0 cm 基準 -->
    <path d="M66,214 Q30,196 14,130 Q6,104 22,98 Q40,94 52,118 L76,166 Z" fill="${base}" stroke="${edge}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle id="tip" cx="22" cy="98" r="0"/>
    ${f(78, 26, 56)}${f(108, 26, 38)}${f(138, 26, 48)}${f(168, 22, 80)}
    <path d="M76,140 L190,140 L192,206 Q192,236 164,238 L106,238 Q76,236 76,206 Z" fill="${base}" stroke="${edge}" stroke-width="1.6"/>
    <rect x="76" y="138" width="114" height="10" fill="${base}"/>
    <!-- 指縫線 -->
    <path d="M106,150 L106,200 M136,150 L136,204 M166,150 L166,200" stroke="${seam}" stroke-width="1.6" opacity=".55"/>
    <!-- 指節護墊 -->
    <rect x="82" y="88" width="18" height="14" rx="5" fill="${pad}"/><rect x="112" y="70" width="18" height="14" rx="5" fill="${pad}"/>
    <rect x="142" y="80" width="18" height="14" rx="5" fill="${pad}"/><rect x="170" y="110" width="16" height="12" rx="5" fill="${pad}"/>
    <rect x="24" y="112" width="14" height="12" rx="5" fill="${pad}" transform="rotate(-30 31 118)"/>
    <!-- 掌心止滑 -->
    <path d="M90,160 L182,160 L184,200 Q182,224 160,226 L110,226 Q88,224 86,200 Z" fill="#000" opacity=".28"/>
    <path d="M98,172 h78 M98,186 h78 M100,200 h74 M104,214 h66" stroke="${seam}" stroke-width="1.6" stroke-dasharray="3 3" opacity=".55"/>
    <!-- 腕帶 -->
    <rect x="80" y="232" width="110" height="26" rx="6" fill="${cuff}"/>
    <rect x="134" y="238" width="48" height="14" rx="3" fill="#1a1a1f"/><rect x="138" y="241" width="40" height="8" rx="2" fill="#777"/>
    <text x="96" y="250" font-size="9" font-weight="800" fill="#fff" font-family="Arial" opacity=".9">${c.en}</text>
  </svg>`;
}
const stage = document.getElementById('stage'), ruler = document.getElementById('ruler'), msg = document.getElementById('msg'), res = document.getElementById('res'), glove = document.getElementById('glove');
const PX_PER_CM = 10, G = 980;
let state = 'idle', t0 = 0, raf = 0, timer = 0, hist = [], TOP0 = 0, car = CARS[2];
// 刻度
for (let cm = 0; cm <= 42; cm++) {
  const i = document.createElement('i'); i.style.bottom = (cm * PX_PER_CM) + 'px'; i.style.width = cm % 5 === 0 ? '18px' : '9px'; ruler.appendChild(i);
  if (cm % 5 === 0 && cm > 0) { const b = document.createElement('b'); b.style.bottom = (cm * PX_PER_CM) + 'px'; b.textContent = cm; ruler.appendChild(b); }
}
function setTeam(id) {
  car = CARS.find(c => c.id === id); glove.innerHTML = gloveSVG(car);
  document.querySelectorAll('.teams button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  // 尺：0 cm 對齊拇指尖，水平放在拇指與食指之間的 V 口
  const tip = document.getElementById('tip').getBoundingClientRect(), st = stage.getBoundingClientRect();
  const tipX = tip.left - st.left, tipY = tip.top - st.top;
  ruler.style.left = (tipX + 14) + 'px';
  TOP0 = tipY - 420;
  reset();
}
document.getElementById('teams').innerHTML = CARS.map(c => `<button data-id="${c.id}" style="--c:${c.label}">${c.en}</button>`).join('');
document.querySelectorAll('.teams button').forEach(b => b.addEventListener('click', () => setTeam(b.dataset.id)));

function reset() { cancelAnimationFrame(raf); clearTimeout(timer); ruler.style.top = TOP0 + 'px'; res.innerHTML = ''; stage.classList.remove('done'); }
function arm() {
  reset(); state = 'armed'; msg.textContent = '準備…尺隨時會掉';
  timer = setTimeout(() => {
    state = 'falling'; t0 = performance.now(); msg.textContent = '';
    const loop = () => {
      const t = (performance.now() - t0) / 1000, d = 0.5 * G * t * t;
      ruler.style.top = (TOP0 + d * PX_PER_CM) + 'px';
      if (d >= 42) { finish(null); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }, 1000 + Math.random() * 2500);
}
function finish(ms) {
  cancelAnimationFrame(raf); state = 'result'; stage.classList.add('done');
  if (ms == null) { res.innerHTML = '<div class="box"><div class="big bad">沒接到</div><div class="g">尺掉出手外（超過 42 cm）。點畫面再試</div></div>'; msg.textContent = ''; return; }
  const t = ms / 1000, d = 0.5 * G * t * t;
  hist.push(ms);
  const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
  res.innerHTML = `<div class="box"><div class="big">${d.toFixed(1)}<span style="font-size:22px"> cm</span></div><div class="ms">${t.toFixed(3)} 秒</div><div class="g">${grade(ms)}・點畫面再試</div></div>`;
  document.getElementById('hist').textContent = `本次：${t.toFixed(3)}s　平均：${(avg / 1000).toFixed(3)}s　次數：${hist.length}`;
}
function grade(ms) { return ms < 120 ? '預判或運氣' : ms < 150 ? '職業級' : ms < 180 ? '很快' : ms < 220 ? '一般人' : ms < 280 ? '慢半拍' : '還在看尺'; }
stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'idle' || state === 'result') { arm(); return; }
  if (state === 'armed') { reset(); state = 'result'; stage.classList.add('done'); res.innerHTML = '<div class="box"><div class="big bad">太早了</div><div class="g">尺還沒掉就捏。點畫面再試</div></div>'; msg.textContent = ''; return; }
  if (state === 'falling') finish(performance.now() - t0);
});
setTeam((new URLSearchParams(location.search).get('team')) || 'mclaren');
</script>
</body>
</html>
