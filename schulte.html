<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>舒爾特方格（體驗版）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0b0e; color: #eee; font-family: "Segoe UI","Microsoft JhengHei",sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px 0 30px; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; color: #bbb; margin: 0 0 4px; }
  .sub { color: #666; font-size: 12px; margin-bottom: 10px; }
  .hud { display: flex; gap: 22px; color: #888; font-size: 13px; margin-bottom: 10px; }
  .hud b { display: block; color: #fff; font-size: 24px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: min(340px, 90vw); background: #1a1a1f; padding: 10px; border-radius: 14px; box-shadow: 0 10px 40px #000; touch-action: none; }
  .c { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; background: #26262c; border-radius: 8px; color: #eee; font-variant-numeric: tabular-nums; }
  .c.done { background: #163a26; color: #3ddc84; }
  .c.err { background: #5a1a1a; }
  .grid.blur .c { color: transparent; }
  .start { margin-top: 16px; padding: 12px 28px; border-radius: 999px; border: 0; background: #e60000; color: #fff; font-weight: 800; font-size: 16px; letter-spacing: 2px; cursor: pointer; font-family: inherit; box-shadow: 0 6px 18px #000; }
  .res { margin-top: 14px; text-align: center; min-height: 70px; }
  .res .big { font-size: 48px; font-weight: 800; color: #3ddc84; line-height: 1; }
  .res .g { font-size: 14px; color: #888; margin-top: 6px; }
  .hint { margin-top: 10px; color: #666; font-size: 13px; width: min(340px, 90vw); text-align: center; line-height: 1.6; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
</style>
</head>
<body>
  <h1>舒爾特方格</h1>
  <div class="sub">體驗版・依序點 1 → 25，越快越好</div>
  <div class="hud"><div>時間<b id="t">0.0</b></div><div>下一個<b id="n">1</b></div><div>點錯<b id="e">0</b></div></div>
  <div class="grid blur" id="grid"></div>
  <button class="start" id="btn">START</button>
  <div class="res" id="res"></div>
  <div class="hint">測的是視覺搜尋速度，車手看儀表、後照鏡、旗號都靠這個。<br>一般成人 5×5 約 25–35 秒；20 秒以內很快；15 秒以內是訓練過的水準。</div>
  <div class="sig">Generated by Gary Fan</div>
<script>
const grid = document.getElementById('grid'), btn = document.getElementById('btn'), res = document.getElementById('res');
let next = 1, errs = 0, t0 = 0, raf = 0, state = 'idle', hist = [];
function build() {
  const nums = Array.from({ length: 25 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
  grid.innerHTML = nums.map(n => `<div class="c" data-n="${n}">${n}</div>`).join('');
}
function start() {
  build(); grid.classList.remove('blur'); next = 1; errs = 0; hud(); state = 'run'; res.innerHTML = ''; btn.textContent = '重來';
  t0 = performance.now();
  const loop = () => { document.getElementById('t').textContent = ((performance.now() - t0) / 1000).toFixed(1); if (state === 'run') raf = requestAnimationFrame(loop); };
  raf = requestAnimationFrame(loop);
}
function hud() { document.getElementById('n').textContent = next > 25 ? '✓' : next; document.getElementById('e').textContent = errs; }
grid.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state !== 'run') return;
  const c = e.target.closest('.c'); if (!c) return;
  if (+c.dataset.n === next) { c.classList.add('done'); next++; hud(); if (next > 25) finish(); }
  else { errs++; hud(); c.classList.add('err'); setTimeout(() => c.classList.remove('err'), 200); }
});
function finish() {
  state = 'done'; cancelAnimationFrame(raf);
  const s = (performance.now() - t0) / 1000; hist.push(s);
  document.getElementById('t').textContent = s.toFixed(1);
  const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
  res.innerHTML = `<div class="big">${s.toFixed(1)}<span style="font-size:20px"> 秒</span></div><div class="g">${grade(s)}・每格 ${(s / 25).toFixed(2)}s・點錯 ${errs}　｜　平均 ${avg.toFixed(1)}s，共 ${hist.length} 次</div>`;
}
function grade(s) { return s < 12 ? '職業級' : s < 15 ? '訓練過' : s < 20 ? '很快' : s < 30 ? '一般人' : s < 40 ? '慢半拍' : '還在找數字'; }
btn.addEventListener('click', start);
build();
</script>
</body>
</html>
