<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 五燈反應測試器</title>
<style>
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 28px 0 40px;
    background: #0b0b0e; color: #eee; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body > * { flex-shrink: 0; }
  h1 { font-weight: 600; letter-spacing: 2px; margin: 0 0 24px; font-size: 22px; color: #bbb; }
  .gantry { background: #1a1a1f; padding: 24px 28px; border-radius: 14px; box-shadow: 0 10px 40px #000; display: flex; gap: 22px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lamp { width: 64px; height: 64px; border-radius: 50%; background: #2a2a30; border: 4px solid #111; transition: background .05s; }
  .col.on .lamp { background: #ff1e1e; box-shadow: 0 0 22px #ff1e1e, 0 0 50px #ff000080; }
  /* F1 方向盤風格紅色啟動鍵 */
  .start-wrap { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start {
    width: 120px; height: 120px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 38% 32%, #ff6b6b 0%, #e60000 45%, #8f0000 100%);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 10px 24px #000, inset 0 -6px 12px #5a0000, inset 0 4px 8px #ff9a9a80;
    color: #fff; font-weight: 800; font-size: 18px; letter-spacing: 2px; font-family: inherit;
    transition: transform .05s, box-shadow .05s;
  }
  .start:active, .start.down {
    transform: translateY(3px);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 4px 10px #000, inset 0 -2px 6px #5a0000, inset 0 6px 12px #3a0000;
  }
  .start:focus-visible { outline: 2px solid #3ddc84; outline-offset: 14px; }
  .start small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .85; margin-top: 2px; }
  .start-wrap .lbl { font-size: 12px; color: #666; letter-spacing: 1px; }
  .status { margin-top: 24px; font-size: 28px; min-height: 110px; text-align: center; }
  .time { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: #3ddc84; } .bad { color: #ff5252; } .dim { color: #888; font-size: 18px; }
  .stats { margin-top: 18px; display: flex; gap: 30px; color: #aaa; font-size: 15px; }
  .stats b { color: #fff; font-size: 20px; }
  .hint { margin-top: 26px; color: #666; font-size: 14px; }
  .ladder { margin-top: 22px; width: min(560px, 92vw); border-radius: 10px; overflow: hidden; border: 1px solid #26262c; }
  .tier { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 12px; font-size: 13px; color: #888; border-bottom: 1px solid #1c1c22; background: #121216; }
  .tier:last-child { border-bottom: 0; }
  .tier .r { font-variant-numeric: tabular-nums; color: #aaa; }
  .tier .n { color: #ccc; }
  .tier .d { grid-column: 2; font-size: 11px; color: #666; }
  .tier.me { background: #1f2a1f; border-left: 4px solid #3ddc84; color: #fff; }
  .tier.me .n, .tier.me .r { color: #fff; font-weight: 600; }
  .tier.me .d { color: #9fd9b4; }
  .btn { margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 1px solid #3ddc84; background: transparent; color: #3ddc84; font-size: 15px; cursor: pointer; display: none; }
  .btn:hover { background: #3ddc8422; }
  .btn.show { display: inline-block; }
  .note { margin-top: 8px; color: #555; font-size: 11px; width: min(560px, 92vw); text-align: center; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
  @media (max-width: 520px) { .lamp { width: 44px; height: 44px; } .gantry { gap: 12px; padding: 16px; } .time { font-size: 48px; } }
</style>
</head>
<body>
  <h1>F1 五燈反應測試</h1>
  <div class="gantry" id="gantry">
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
  </div>
  <div class="start-wrap">
    <button class="start" id="startBtn" aria-label="啟動">START<small>PUSH</small></button>
    <div class="lbl">只有這顆鍵會啟動／停止計時</div>
  </div>
  <div class="status" id="status"><span class="dim">按紅色啟動鍵或空白鍵開始</span></div>
  <div class="stats">
    <div>最佳 <b id="best">--</b> s</div>
    <div>平均 <b id="avg">--</b> s</div>
    <div>次數 <b id="count">0</b></div>
  </div>
  <button class="btn" id="shot">📷 截圖分享成績</button>
  <div class="ladder" id="ladder"></div>
  <div class="note">對照用的是 F1 轉播「熄燈→車子開始動」的時間；Bottas 2019 日本站自述的 0.04s 是離合器撥片動作，不列入。</div>
  <div class="hint">按紅鍵開始 → 五燈依序亮起 → 全部熄滅的瞬間再按一次紅鍵。燈熄滅前就按 = 偷跑(Jump Start)。滑動畫面不會觸發。</div>
  <div class="sig">Generated by Gary Fan</div>

<script>
const cols = [...document.querySelectorAll('.col')];
const statusEl = document.getElementById('status');
const bestEl = document.getElementById('best'), avgEl = document.getElementById('avg'), countEl = document.getElementById('count');

// 狀態機：idle → lighting(亮燈中) → armed(全亮，等隨機延遲) → go(已熄滅，計時中) → result
let state = 'idle';
let timers = [];
let lightsOutAt = 0;
let results = [];
let lastRt = null;
const fmt = ms => (ms / 1000).toFixed(2);   // 轉播格式：0.21

function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function setLights(n) { cols.forEach((c, i) => c.classList.toggle('on', i < n)); }
function show(html) { statusEl.innerHTML = html; }

function start() {
  clearTimers();
  shotBtn.classList.remove('show');
  state = 'lighting';
  setLights(0);
  show('<span class="dim">準備…</span>');
  // 每 1 秒亮一盞，共 5 盞
  for (let i = 1; i <= 5; i++) {
    timers.push(setTimeout(() => setLights(i), i * 1000));
  }
  // 第 5 燈亮起後，隨機 0.2~3 秒(真實 F1 規則)全滅
  const hold = 200 + Math.random() * 2800;
  timers.push(setTimeout(() => { state = 'armed'; }, 5000));
  timers.push(setTimeout(() => {
    setLights(0);
    lightsOutAt = performance.now();   // 以熄燈那一刻為基準
    state = 'go';
  }, 5000 + hold));
}

function press() {
  if (state === 'idle' || state === 'result') { start(); return; }
  if (state === 'lighting' || state === 'armed') {        // 燈還沒滅就按
    clearTimers(); setLights(0); state = 'result';
    show('<span class="bad">偷跑！JUMP START</span><br><span class="dim">再按一次重來</span>');
    return;
  }
  if (state === 'go') {
    const rt = Math.round(performance.now() - lightsOutAt);
    state = 'result';
    results.push(rt);
    const cls = rt < 200 ? 'ok' : rt < 300 ? '' : 'bad';
    show(`<div class="time ${cls}">${fmt(rt)}<span style="font-size:.5em">s</span></div><span class="dim">${grade(rt)}　再按一次重來</span>`);
    updateStats();
    renderLadder(rt);
    lastRt = rt;
    shotBtn.classList.add('show');
  }
}

// 等級階梯（來源：FIA / F1 官方 / Motorsport.com 轉播數據）
const TIERS = [
  { min: 0,   max: 100, name: '超越人類極限', desc: '比燈還快，F1 會直接判偷跑。你大概是猜的。' },
  { min: 100, max: 150, name: '裁判盯上你了', desc: 'FIA 把車動低於 0.2s 視為可疑；這區間幾乎只有預判做得到。' },
  { min: 150, max: 200, name: '傳奇起跑', desc: 'Bottas 2017 奧地利 0.201s，對手質疑偷跑、FIA 判合法。你比他還快。' },
  { min: 200, max: 250, name: 'F1 頂尖起跑者', desc: '轉播顯示頂尖起跑多落在 0.20–0.25s，F1 官方說車手平均約 0.2s。' },
  { min: 250, max: 300, name: 'F1 車手水準', desc: '正規 F1 車手常見區間，能站上發車格。' },
  { min: 300, max: 350, name: '一般人平均', desc: '人類平均反應約 0.30s。' },
  { min: 350, max: 500, name: '起跑被超車', desc: '熄燈後慢半拍，旁邊的車已經先衝。' },
  { min: 500, max: Infinity, name: '還在看燈', desc: '多練幾次會進步，這很正常。' },
];
function tierOf(rt) { return TIERS.find(t => rt >= t.min && rt < t.max); }
function grade(rt) { return tierOf(rt).name; }
function renderLadder(rt) {
  document.getElementById('ladder').innerHTML = TIERS.map(t => {
    const range = t.max === Infinity ? `${fmt(t.min)}s 以上` : `${fmt(t.min)}–${fmt(t.max)}s`;
    const me = rt != null && rt >= t.min && rt < t.max ? ' me' : '';
    return `<div class="tier${me}"><span class="r">${range}</span><span class="n">${t.name}${me ? '　← 你在這' : ''}</span><span class="d">${t.desc}</span></div>`;
  }).join('');
}
renderLadder(null);

function updateStats() {
  bestEl.textContent = fmt(Math.min(...results));
  avgEl.textContent = fmt(results.reduce((a, b) => a + b, 0) / results.length);
  countEl.textContent = results.length;
}

// ===== 結果截圖：用 canvas 畫成績卡，手機走分享、電腦直接下載 =====
const shotBtn = document.getElementById('shot');
['pointerdown', 'click', 'keydown'].forEach(ev => shotBtn.addEventListener(ev, e => e.stopPropagation()));
shotBtn.addEventListener('click', shareResult);

function drawCard() {
  const W = 900, H = 520, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const t = tierOf(lastRt);
  const best = Math.min(...results), avg = results.reduce((a, b) => a + b, 0) / results.length;
  const font = '"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif';

  g.fillStyle = '#0b0b0e'; g.fillRect(0, 0, W, H);
  // 燈架
  g.fillStyle = '#1a1a1f';
  g.beginPath(); g.roundRect(60, 40, W - 120, 120, 16); g.fill();
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) {
    const x = 60 + 78 + i * 156, y = 40 + 30 + j * 60;
    g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2);
    g.fillStyle = '#2a2a30'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#111'; g.stroke();
  }
  // 標題
  g.fillStyle = '#bbb'; g.font = `600 22px ${font}`; g.textAlign = 'center';
  g.fillText('F1 五燈反應測試', W / 2, 205);
  // 成績
  const color = lastRt < 200 ? '#3ddc84' : lastRt < 300 ? '#ffffff' : '#ff5252';
  g.fillStyle = color; g.font = `700 110px ${font}`;
  g.fillText(`${fmt(lastRt)}s`, W / 2, 320);
  // 等級
  g.fillStyle = '#3ddc84'; g.font = `600 34px ${font}`;
  g.fillText(t.name, W / 2, 372);
  g.fillStyle = '#888'; g.font = `18px ${font}`;
  g.fillText(t.desc, W / 2, 404);
  // 統計
  g.fillStyle = '#aaa'; g.font = `20px ${font}`;
  g.fillText(`最佳 ${fmt(best)}s　　平均 ${fmt(avg)}s　　次數 ${results.length}`, W / 2, 452);
  // 日期與署名
  g.textAlign = 'left'; g.fillStyle = '#555'; g.font = `14px ${font}`;
  g.fillText(new Date().toLocaleString('zh-TW', { hour12: false }), 60, H - 20);
  g.textAlign = 'right'; g.font = `12px ${font}`;
  g.fillText('Generated by Gary Fan', W - 60, H - 20);
  return c;
}

async function shareResult() {
  if (lastRt == null) return;
  const canvas = drawCard();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], `f1-reaction-${fmt(lastRt)}s.png`, { type: 'image/png' });
  // 手機：系統分享面板（LINE、存到相簿…）
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'F1 五燈反應測試', text: `我的反應時間 ${fmt(lastRt)}s，${tierOf(lastRt).name}！` }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // 電腦：直接下載 PNG
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// 只有紅色啟動鍵觸發：pointerdown 比 click 早觸發，延遲更低；滑動畫面其他地方不會觸發
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('pointerdown', e => { e.preventDefault(); startBtn.classList.add('down'); press(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => startBtn.addEventListener(ev, () => startBtn.classList.remove('down')));
startBtn.addEventListener('click', e => e.preventDefault());   // 已在 pointerdown 處理，避免重複
startBtn.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); });
// 鍵盤：空白鍵 / Enter 仍可用（電腦）
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
});
</script>
</body>
</html>
