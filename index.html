<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 起跑反應測試</title>
<style>
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 28px 0 40px;
    background: #0b0b0e; color: #eee; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body > * { flex-shrink: 0; }
  h1 { font-weight: 600; letter-spacing: 2px; margin: 0 0 24px; font-size: 22px; color: #bbb; }
  .gantry { background: #1a1a1f; padding: 24px 28px; border-radius: 14px; box-shadow: 0 10px 40px #000; display: flex; gap: 22px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lamp { width: 64px; height: 64px; border-radius: 50%; background: #2a2a30; border: 4px solid #111; transition: background .05s; }
  .col.on .lamp { background: #ff1e1e; box-shadow: 0 0 22px #ff1e1e, 0 0 50px #ff000080; }
  /* F1 方向盤風格紅色啟動鍵 */
  .start-wrap { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start {
    width: 120px; height: 120px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 38% 32%, #ff6b6b 0%, #e60000 45%, #8f0000 100%);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 10px 24px #000, inset 0 -6px 12px #5a0000, inset 0 4px 8px #ff9a9a80;
    color: #fff; font-weight: 800; font-size: 18px; letter-spacing: 2px; font-family: inherit;
    transition: transform .05s, box-shadow .05s;
  }
  .start:active, .start.down {
    transform: translateY(3px);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 4px 10px #000, inset 0 -2px 6px #5a0000, inset 0 6px 12px #3a0000;
  }
  .start:focus-visible { outline: 2px solid #3ddc84; outline-offset: 14px; }
  .start small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .85; margin-top: 2px; }
  .status { margin-top: 24px; font-size: 28px; min-height: 110px; text-align: center; }
  .time { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: #3ddc84; } .bad { color: #ff5252; } .dim { color: #888; font-size: 18px; }
  .stats { margin-top: 18px; display: flex; gap: 30px; color: #aaa; font-size: 15px; }
  .stats b { color: #fff; font-size: 20px; }
  .hint { margin-top: 26px; color: #666; font-size: 14px; }
  .ladder { margin-top: 22px; width: min(560px, 92vw); border-radius: 10px; overflow: hidden; border: 1px solid #26262c; }
  .tier { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 12px; font-size: 13px; color: #888; border-bottom: 1px solid #1c1c22; background: #121216; }
  .tier:last-child { border-bottom: 0; }
  .tier .r { font-variant-numeric: tabular-nums; color: #aaa; }
  .tier .n { color: #ccc; }
  .tier .d { grid-column: 2; font-size: 11px; color: #666; }
  .tier.me { background: #1f2a1f; border-left: 4px solid #3ddc84; color: #fff; }
  .tier.me .n, .tier.me .r { color: #fff; font-weight: 600; }
  .tier.me .d { color: #9fd9b4; }
  .btn { margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 1px solid #3ddc84; background: transparent; color: #3ddc84; font-size: 15px; cursor: pointer; display: none; }
  .btn:hover { background: #3ddc8422; }
  .btn.show { display: inline-block; }
  .note { margin-top: 8px; color: #555; font-size: 11px; width: min(560px, 92vw); text-align: center; }
  /* 選車畫面 */
  .overlay { position: fixed; inset: 0; background: #0b0b0ef2; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .overlay.hide { display: none; }
  .overlay h2 { margin: 0 0 18px; font-weight: 600; letter-spacing: 2px; color: #ddd; font-size: 22px; }
  .cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(640px, 94vw); }
  .car { background: #15151a; border: 2px solid #26262c; border-radius: 14px; padding: 14px 12px 10px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s; }
  .car:hover, .car:active { transform: translateY(-3px); border-color: var(--c); }
  .car svg { width: 100%; height: auto; display: block; }
  .car .nm { margin-top: 8px; font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--c); }
  /* 標題旁的小車 */
  .mycar { display: flex; align-items: center; gap: 10px; margin: -10px 0 16px; color: #999; font-size: 13px; }
  .mycar svg { width: 130px; height: auto; }
  .mycar a { color: #666; text-decoration: underline; cursor: pointer; font-size: 12px; }
  /* 結果區的車與名字 */
  .result-car { display: none; flex-direction: column; align-items: center; margin-top: 14px; }
  .result-car.show { display: flex; }
  .result-car svg { width: min(320px, 80vw); height: auto; }
  .result-car .team { font-weight: 700; font-size: 18px; margin-top: 4px; }
  .podium { width: min(420px, 92vw); margin-top: 10px; border-radius: 12px; background: #0f0f13; }
  .namebox { display: none; margin-top: 14px; align-items: center; gap: 8px; }
  .namebox.show { display: flex; }
  .namebox input { background: #15151a; border: 1px solid #333; color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 16px; width: 170px; font-family: inherit; }
  .namebox input:focus { outline: 1px solid #3ddc84; }
  .namebox button { padding: 9px 16px; border-radius: 8px; border: 0; background: #3ddc84; color: #000; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
  @media (max-width: 520px) { .lamp { width: 44px; height: 44px; } .gantry { gap: 12px; padding: 16px; } .time { font-size: 48px; } }
</style>
</head>
<body>
  <div class="overlay" id="overlay">
    <h2>選擇你的賽車</h2>
    <div class="cars" id="cars"></div>
  </div>
  <h1>F1 起跑反應測試</h1>
  <div class="mycar" id="mycar"></div>
  <div class="gantry" id="gantry">
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
  </div>
  <div class="start-wrap">
    <button class="start" id="startBtn" aria-label="啟動">START<small>PUSH</small></button>
  </div>
  <div class="status" id="status"><span class="dim">按紅色啟動鍵或空白鍵開始</span></div>
  <div class="stats">
    <div>最佳 <b id="best">--</b> s</div>
    <div>平均 <b id="avg">--</b> s</div>
    <div>次數 <b id="count">0</b></div>
  </div>
  <div class="result-car" id="resultCar"></div>
  <div class="namebox" id="namebox">
    <input id="nameInput" type="text" maxlength="12" placeholder="輸入你的名字" autocomplete="off">
    <button id="nameOk">確定</button>
  </div>
  <button class="btn" id="shot">📷 截圖分享成績</button>
  <div class="ladder" id="ladder"></div>
  <div class="sig">Generated by Gary Fan</div>

<script>
const cols = [...document.querySelectorAll('.col')];
const statusEl = document.getElementById('status');
const bestEl = document.getElementById('best'), avgEl = document.getElementById('avg'), countEl = document.getElementById('count');

// 狀態機：idle → lighting(亮燈中) → armed(全亮，等隨機延遲) → go(已熄滅，計時中) → result
let state = 'idle';
let timers = [];
let lightsOutAt = 0;
let results = [];
let car = null;        // 目前選的車
let playerName = '';

// 四台車：代表色，不是真車，只求一眼認得出來
const CARS = [
  // body 主色 / accent 主要點綴 / accent2 次要點綴 / dark 翼片與側箱深色 / tyre 輪胎側壁色帶
  { id: 'redbull',  en: 'RED BULL', body: '#121f4e', accent: '#e10600', accent2: '#ffd300', dark: '#0a1232', text: '#ffffff' },
  { id: 'ferrari',  en: 'FERRARI',  body: '#e8002d', accent: '#ffffff', accent2: '#ffd300', dark: '#9c0020', text: '#ffffff' },
  { id: 'mclaren',  en: 'McLAREN',  body: '#ff8000', accent: '#1a1a1a', accent2: '#47c7fc', dark: '#2b2b2b', text: '#1a1a1a' },
  { id: 'mercedes', en: 'MERCEDES', body: '#16181c', accent: '#00a19c', accent2: '#c0c4c8', dark: '#0a0a0c', text: '#00a19c' },
];
const labelColor = c => ({ redbull: '#e10600', ferrari: '#e8002d', mclaren: '#ff8000', mercedes: '#00a19c' })[c.id];
// 側面 F1 車：地效世代比例（高鼻、側箱下切、寬尾翼）
function carSVG(c) {
  const id = 'g' + c.id;
  return `<svg viewBox="0 0 400 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
    <radialGradient id="${id}t" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="121" rx="178" ry="5" fill="#000" opacity=".55"/>
  <!-- 尾翼 -->
  <rect x="16" y="22" width="5" height="52" rx="1.5" fill="${c.dark}"/>
  <rect x="10" y="30" width="52" height="8" rx="2" fill="${c.body}"/>
  <rect x="12" y="22" width="48" height="6" rx="2" fill="${c.accent}"/>
  <rect x="20" y="68" width="34" height="4" rx="1.5" fill="${c.dark}"/>
  <!-- 底板 -->
  <path d="M34 104 L340 104 L336 110 L40 110 Z" fill="#0b0b0b"/>
  <!-- 懸吊 -->
  <g stroke="#1c1c1c" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="86" x2="92" y2="78"/><line x1="108" y1="86" x2="92" y2="78"/>
    <line x1="292" y1="84" x2="310" y2="76"/><line x1="332" y1="86" x2="310" y2="76"/>
  </g>
  <!-- 車身主體 -->
  <path d="M40 104 L46 82 C62 62 108 56 150 54 L158 46 Q168 40 178 44 L186 54 L222 60 C282 64 332 74 366 86 L370 96 L300 96 L268 104 Z" fill="${c.body}"/>
  <path d="M40 104 L46 82 C62 62 108 56 150 54 L158 46 Q168 40 178 44 L186 54 L222 60 C282 64 332 74 366 86 L370 96 L300 96 L268 104 Z" fill="url(#${id}b)"/>
  <!-- 引擎蓋鰭片與色條 -->
  <path d="M48 80 C66 62 110 57 150 55 L148 60 C112 62 72 68 52 84 Z" fill="${c.accent}" opacity=".9"/>
  <!-- 側箱（下切） -->
  <path d="M104 74 L214 68 L224 86 L206 104 L126 104 L112 92 Z" fill="${c.dark}"/>
  <path d="M110 78 L212 72 L218 80 L116 86 Z" fill="${c.accent2}" opacity=".9"/>
  <!-- 側箱進氣口 -->
  <path d="M212 68 L226 70 L230 80 L224 86 Z" fill="#050505"/>
  <!-- 座艙與頭枕 -->
  <path d="M186 54 L192 44 L214 46 L222 60 Z" fill="#070707"/>
  <path d="M184 56 L190 52 L196 54 L192 60 Z" fill="${c.dark}"/>
  <!-- 安全帽 -->
  <circle cx="206" cy="51" r="6.5" fill="${c.accent2}"/>
  <path d="M204 49 Q209 47 212 51 L211 54 Q207 53 204 52 Z" fill="#111"/>
  <!-- Halo -->
  <path d="M188 56 Q210 28 240 58" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <line x1="214" y1="40" x2="214" y2="52" stroke="#1a1a1a" stroke-width="4"/>
  <!-- 鼻翼與前翼 -->
  <rect x="300" y="100" width="92" height="6" rx="2" fill="${c.dark}"/>
  <rect x="308" y="93" width="84" height="5" rx="2" fill="${c.accent}"/>
  <rect x="316" y="87" width="72" height="4" rx="2" fill="${c.body}"/>
  <rect x="388" y="82" width="5" height="26" rx="1.5" fill="${c.dark}"/>
  <!-- 車輪 -->
  <g>
    <circle cx="90" cy="94" r="25" fill="url(#${id}t)"/><circle cx="90" cy="94" r="21" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="90" cy="94" r="12" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/><circle cx="90" cy="94" r="4" fill="${c.accent}"/>
    <circle cx="310" cy="94" r="25" fill="url(#${id}t)"/><circle cx="310" cy="94" r="21" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="310" cy="94" r="12" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/><circle cx="310" cy="94" r="4" fill="${c.accent}"/>
  </g>
  <!-- 車隊字樣 -->
  <text x="130" y="100" font-size="10" font-weight="800" letter-spacing="1" fill="${c.text}" font-family="Arial, Helvetica, sans-serif">${c.en}</text>
  </svg>`;
}
// ===== 頒獎台（版本 B）：賽車服顏色跟車隊 =====
// 安全帽配色（只動安全帽，車的顏色不動）
const HELMETS = {
  redbull:  { helm: '#ffffff', stripe: '#e10600' },
  ferrari:  { helm: '#ffd300', stripe: '#ffffff' },
  mclaren:  { helm: '#1e4fd8', stripe: '#e10600' },
  mercedes: { helm: '#00a19c', stripe: '#c0c4c8' },
};
function podiumSVG(tierIdx, c) {
  const SUIT = c.body, { helm: HELM, stripe: STRIPE } = HELMETS[c.id];
  const ACC = c.id === 'mercedes' ? '#c0c4c8' : c.accent === '#ffffff' ? '#ffffff' : c.accent;   // 賽車服胸帶
  const ACC2 = c.accent2, EDGE = c.id === 'mercedes' ? '#8a8e94' : 'none';
  const K = 0.42;   // 人物縮放：原稿 120×200 → 約 50×84
  const gold = `<linearGradient id="gold${c.id}" x1="0" x2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".5" stop-color="#f5c400"/><stop offset="1" stop-color="#b8860b"/></linearGradient>`;
  const trophy = (x, y, k = 1) => `<g transform="translate(${x},${y}) scale(${k})">
    <path d="M-12,0 L12,0 L9,18 Q0,26 -9,18 Z" fill="url(#gold${c.id})"/>
    <path d="M-12,2 Q-22,8 -11,16 M12,2 Q22,8 11,16" stroke="#f5c400" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <rect x="-3" y="24" width="6" height="6" fill="#f5c400"/><rect x="-10" y="30" width="20" height="4" rx="1" fill="#8a6508"/>
    <ellipse cx="-4" cy="6" rx="2" ry="5" fill="#fff" opacity=".5"/></g>`;
  const helmet = (x, y, tilt = 0) => `<g transform="translate(${x},${y}) rotate(${tilt})">
    <path d="M-16,0 a16,16 0 0 1 32,0 v10 q0,8 -8,8 h-16 q-8,0 -8,-8z" fill="${HELM}"/>
    <path d="M-14,-4 h28 v10 q0,3 -3,3 h-22 q-3,0 -3,-3z" fill="#0d0d12"/>
    <path d="M-12,-2 h10 v3 h-10z" fill="#fff" opacity=".35"/>
    <path d="M-4,-16 q4,-2 8,0 l-1,7 q-3,-1 -6,0z" fill="${STRIPE}"/>
    <path d="M-16,2 h4 v8 h-4z M12,2 h4 v8 h-4z" fill="${STRIPE}" opacity=".9"/></g>`;
  const torso = `<path d="M42,54 h36 l6,22 l-4,36 h-40 l-4,-36z" fill="${SUIT}" stroke="${EDGE}" stroke-width="1"/>
    <path d="M40,74 h40 v5 h-40z" fill="${ACC}"/>
    <path d="M44,90 h12 v5 h-12z M64,90 h12 v5 h-12z" fill="${ACC2}" opacity=".85"/>
    <rect x="58" y="56" width="4" height="56" fill="#000" opacity=".25"/>
    <rect x="40" y="110" width="40" height="5" fill="#111"/>
    <path d="M52,54 l8,6 l8,-6" fill="none" stroke="${ACC}" stroke-width="2.5"/>
    <rect x="55" y="42" width="10" height="12" fill="#1a1a1a"/>`;
  const legsStand = `<path d="M50,110 l-4,40 l-2,38" stroke="${SUIT}" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M70,110 l4,40 l2,38" stroke="${SUIT}" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M38,186 h14 v6 h-16z" fill="#111"/><path d="M70,186 h14 v6 h-16z" fill="#111"/>
    <path d="M46,150 l-1,6 M74,150 l1,6" stroke="${ACC}" stroke-width="3"/>`;
  const arm = (d, gx, gy) => `<path d="${d}" stroke="${SUIT}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="${gx}" cy="${gy}" r="5.5" fill="${STRIPE === '#ffffff' ? '#1a1a1a' : STRIPE}"/>`;
  const champagne = `<g><path d="M14,40 l-6,-26" stroke="#2a5c2a" stroke-width="7" stroke-linecap="round"/><path d="M8,14 l-2,-8" stroke="#2a5c2a" stroke-width="4" stroke-linecap="round"/>
    <g fill="#e9f2a0"><circle cx="2" cy="-4" r="3"/><circle cx="-8" cy="-12" r="3.5"/><circle cx="-16" cy="-2" r="2.5"/><circle cx="-22" cy="-16" r="3"/><circle cx="-6" cy="4" r="2"/><circle cx="-28" cy="-6" r="2"/></g></g>`;

  // 站姿：pose = 'champ' 雙手高舉(獎盃+香檳) | 'trophy' 右手舉獎盃 | 'clap' 胸前鼓掌
  const standing = (x, y, pose) => {
    let arms = '';
    if (pose === 'champ') arms = arm('M44,58 l-16,-14 l-10,-26', 17, 18) + `<g transform="translate(14,8)">${champagne}</g>` + arm('M76,58 l16,-14 l10,-26', 103, 18) + trophy(104, -14, .9);
    else if (pose === 'trophy') arms = arm('M44,58 l-8,26 l2,28', 38, 116) + arm('M76,58 l16,14 l10,-26', 103, 44) + trophy(104, 12, .9);
    else arms = arm('M44,58 l-4,22 l14,10', 56, 92) + arm('M76,58 l4,22 l-14,10', 64, 92);
    return `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)"><ellipse cx="60" cy="193" rx="26" ry="3.5" fill="#000" opacity=".5"/>${legsStand}${torso}${arms}${helmet(60, 34)}</g>`;
  };
  // 坐姿：坐在地上，身體前傾、低頭、手放膝上
  const sitting = (x, y, o = {}) => `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)">
    <ellipse cx="70" cy="193" rx="40" ry="3.5" fill="#000" opacity=".5"/>
    <path d="M56,146 l34,-2 l6,44" stroke="${SUIT}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M64,150 l34,0 l4,38" stroke="${SUIT}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".92"/>
    <path d="M90,186 h16 v6 h-18z M96,184 h16 v6 h-18z" fill="#111"/>
    <g transform="translate(60,150) rotate(12) translate(-60,-150)">
      <path d="M42,94 h36 l6,22 l-4,34 h-40 l-4,-34z" fill="${SUIT}" stroke="${EDGE}" stroke-width="1"/>
      <path d="M40,114 h40 v5 h-40z" fill="${ACC}"/>
      <rect x="58" y="96" width="4" height="50" fill="#000" opacity=".25"/>
      <rect x="55" y="82" width="10" height="12" fill="#1a1a1a"/>
      ${arm('M46,98 l8,30 l30,10', 86, 138)}
      ${helmet(60, 74, 25)}
    </g>
    ${o.sweat ? '<path d="M92,70 q5,-7 5,3 q0,5 -5,5 q-5,0 -5,-5 q0,-3 5,-3z" fill="#6cf"/>' : ''}
    ${o.q ? '<text x="96" y="66" font-size="30" fill="#aaa" font-weight="800" font-family="Arial">?</text>' : ''}
  </g>`;
  // 躺姿：躺平，一手遮面罩
  const lying = (x, y) => `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)">
    <ellipse cx="80" cy="193" rx="70" ry="3.5" fill="#000" opacity=".5"/>
    <path d="M86,176 l32,-2 l30,4" stroke="${SUIT}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M86,184 l34,0 l30,2" stroke="${SUIT}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".92"/>
    <path d="M146,170 h6 v16 h-8z M150,180 h6 v12 h-8z" fill="#111"/>
    <path d="M40,168 h46 l2,24 h-50z" fill="${SUIT}" stroke="${EDGE}" stroke-width="1"/>
    <path d="M62,166 h5 v28 h-5z" fill="${ACC}"/>
    ${arm('M46,172 l-10,-18 l16,-4', 52, 150)}
    <g transform="translate(28,180) rotate(-90)">${helmet(0, 0)}</g>
    <text x="4" y="150" font-size="22" fill="#777" font-family="Arial">z z</text>
  </g>`;
  // 裁判：白襯衫、深褲、帽子、舉牌
  const steward = (x, y, text) => `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)">
    <ellipse cx="60" cy="193" rx="24" ry="3.5" fill="#000" opacity=".5"/>
    <path d="M52,110 l-3,40 l-1,38 M68,110 l3,40 l1,38" stroke="#2b2b33" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M40,186 h14 v6 h-16z M70,186 h14 v6 h-16z" fill="#111"/>
    <path d="M44,54 h32 l6,20 l-3,38 h-38 l-3,-38z" fill="#e8e8ea"/>
    <rect x="58" y="56" width="3" height="56" fill="#bbb"/><rect x="41" y="110" width="38" height="5" fill="#222"/>
    <path d="M54,54 l6,8 l6,-8" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M46,60 l-10,28 l6,26" stroke="#e8e8ea" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="42" cy="116" r="5" fill="#f1c8a0"/>
    <path d="M74,60 l14,10 l6,-24" stroke="#e8e8ea" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="94" cy="44" r="5" fill="#f1c8a0"/>
    <rect x="92" y="-8" width="5" height="50" fill="#999"/>
    <rect x="66" y="-26" width="58" height="34" rx="3" fill="#fff" stroke="#999" stroke-width="2"/>
    <text x="95" y="-3" font-size="15" font-weight="800" fill="#c00" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei'">${text}</text>
    <circle cx="60" cy="34" r="13" fill="#f1c8a0"/><path d="M46,30 a14,14 0 0 1 28,0 z" fill="#222"/><rect x="44" y="28" width="32" height="5" rx="2" fill="#222"/>
    <path d="M55,38 h10" stroke="#a0785a" stroke-width="2"/>
  </g>`;
  const tag = (x, y, text, color = '#3ddc84') => `<g><rect x="${x - 36}" y="${y - 11}" width="72" height="16" rx="8" fill="${color}"/><text x="${x}" y="${y + 1}" font-size="9" font-weight="700" fill="#000" text-anchor="middle">${text}</text></g>`;
  const ground = `<rect x="0" y="150" width="300" height="20" fill="#16161b"/>`;
  const podium = `<g>
      <rect x="62" y="108" width="58" height="42" fill="#2a2a32"/><text x="91" y="128" font-size="16" font-weight="800" fill="#c0c0c0" text-anchor="middle">2</text>
      <rect x="120" y="90" width="60" height="60" fill="#34343e"/><text x="150" y="110" font-size="18" font-weight="800" fill="#ffd700" text-anchor="middle">1</text>
      <rect x="180" y="122" width="58" height="28" fill="#2a2a32"/><text x="209" y="140" font-size="16" font-weight="800" fill="#cd7f32" text-anchor="middle">3</text>
    </g>`;
  const office = `<rect x="6" y="116" width="58" height="34" fill="#1f1f26"/><rect x="4" y="112" width="62" height="5" fill="#3a3a44"/>`;
  let fig = '', note = '';
  switch (tierIdx) {
    case 0: fig = office + sitting(24, 150, { q: true }) + steward(62, 150, 'DSQ'); note = tag(40, -22, '取消資格', '#ff5252'); break;
    case 1: fig = office + sitting(24, 150, { sweat: true }) + steward(62, 150, '調查中'); note = tag(40, -22, '裁判審查', '#ffb300'); break;
    case 2: fig = standing(150, 90, 'champ'); note = tag(150, -22, '冠軍'); break;
    case 3: fig = standing(91, 108, 'trophy'); note = tag(91, -22, '亞軍', '#c0c0c0'); break;
    case 4: fig = standing(209, 122, 'trophy'); note = tag(209, -22, '季軍', '#cd7f32'); break;
    case 5: fig = standing(266, 150, 'clap'); note = tag(260, -22, '台下鼓掌', '#9aa'); break;
    case 6: fig = sitting(252, 150, { sweat: true }); note = tag(260, -22, '坐地失落', '#778'); break;
    default: fig = lying(256, 150); note = tag(260, -22, '躺平', '#667'); break;
  }
  return `<svg class="podium" viewBox="0 -40 300 210" xmlns="http://www.w3.org/2000/svg"><defs>${gold}</defs>${ground}${podium}${fig}${note}</svg>`;
}
const tierIndex = rt => TIERS.indexOf(tierOf(rt));

const overlay = document.getElementById('overlay');
document.getElementById('cars').innerHTML = CARS.map(c =>
  `<div class="car" data-id="${c.id}" style="--c:${labelColor(c)}">${carSVG(c)}<div class="nm">${c.en}</div></div>`).join('');
document.querySelectorAll('.car').forEach(el => el.addEventListener('click', () => chooseCar(el.dataset.id)));
function chooseCar(id) {
  car = CARS.find(c => c.id === id);
  overlay.classList.add('hide');
  document.getElementById('mycar').innerHTML = `${carSVG(car)}<div><b style="color:${labelColor(car)}">${car.en}</b><br><a id="changeCar">換車</a></div>`;
  document.getElementById('changeCar').addEventListener('click', () => { clearTimers(); setLights(0); state = 'idle'; show('<span class="dim">按紅色啟動鍵或空白鍵開始</span>'); hideResultExtras(); overlay.classList.remove('hide'); });
}
const resultCar = document.getElementById('resultCar'), namebox = document.getElementById('namebox'), nameInput = document.getElementById('nameInput');
function hideResultExtras() { resultCar.classList.remove('show'); namebox.classList.remove('show'); shotBtn.classList.remove('show'); }

let lastRt = null;
const fmt = ms => (ms / 1000).toFixed(2);   // 轉播格式：0.21

function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function setLights(n) { cols.forEach((c, i) => c.classList.toggle('on', i < n)); }
function show(html) { statusEl.innerHTML = html; }

function start() {
  clearTimers();
  hideResultExtras();
  state = 'lighting';
  setLights(0);
  show('<span class="dim">準備…</span>');
  // 每 1 秒亮一盞，共 5 盞
  for (let i = 1; i <= 5; i++) {
    timers.push(setTimeout(() => setLights(i), i * 1000));
  }
  // 第 5 燈亮起後，隨機 0.2~3 秒(真實 F1 規則)全滅
  const hold = 200 + Math.random() * 2800;
  timers.push(setTimeout(() => { state = 'armed'; }, 5000));
  timers.push(setTimeout(() => {
    setLights(0);
    lightsOutAt = performance.now();   // 以熄燈那一刻為基準
    state = 'go';
  }, 5000 + hold));
}

function press() {
  if (!car) return;                                   // 還沒選車
  if (state === 'idle' || state === 'result') { start(); return; }
  if (state === 'lighting' || state === 'armed') {        // 燈還沒滅就按
    clearTimers(); setLights(0); state = 'result';
    show('<span class="bad">偷跑！JUMP START</span><br><span class="dim">再按一次重來</span>');
    return;
  }
  if (state === 'go') {
    const rt = Math.round(performance.now() - lightsOutAt);
    state = 'result';
    results.push(rt);
    const cls = rt < 200 ? 'ok' : rt < 300 ? '' : 'bad';
    show(`<div class="time ${cls}">${fmt(rt)}<span style="font-size:.5em">s</span></div><span class="dim">${grade(rt)}　再按一次重來</span>`);
    updateStats();
    renderLadder(rt);
    lastRt = rt;
    resultCar.innerHTML = `${carSVG(car)}<div class="team" style="color:${labelColor(car)}">${car.en}</div>${podiumSVG(tierIndex(rt), car)}`;
    resultCar.classList.add('show');
    nameInput.value = playerName;
    namebox.classList.add('show');
    if (playerName) shotBtn.classList.add('show');   // 已輸入過名字就直接出現
    else setTimeout(() => nameInput.focus(), 50);
  }
}

// 等級階梯（來源：FIA / F1 官方 / Motorsport.com 轉播數據）
const TIERS = [
  { min: 0,   max: 100, name: '超越人類極限', desc: '比燈還快，F1 會直接判偷跑。你大概是猜的。' },
  { min: 100, max: 150, name: '裁判盯上你了', desc: 'FIA 把車動低於 0.2s 視為可疑；這區間幾乎只有預判做得到。' },
  { min: 150, max: 200, name: '傳奇起跑', desc: 'Bottas 2017 奧地利 0.201s，對手質疑偷跑、FIA 判合法。你比他還快。' },
  { min: 200, max: 250, name: 'F1 頂尖起跑者', desc: '轉播顯示頂尖起跑多落在 0.20–0.25s，F1 官方說車手平均約 0.2s。' },
  { min: 250, max: 300, name: 'F1 車手水準', desc: '正規 F1 車手常見區間，能站上發車格。' },
  { min: 300, max: 350, name: '一般人平均', desc: '人類平均反應約 0.30s。' },
  { min: 350, max: 500, name: '起跑被超車', desc: '熄燈後慢半拍，旁邊的車已經先衝。' },
  { min: 500, max: Infinity, name: '還在看燈', desc: '多練幾次會進步，這很正常。' },
];
function tierOf(rt) { return TIERS.find(t => rt >= t.min && rt < t.max); }
function grade(rt) { return tierOf(rt).name; }
function renderLadder(rt) {
  document.getElementById('ladder').innerHTML = TIERS.map(t => {
    const range = t.max === Infinity ? `${fmt(t.min)}s 以上` : `${fmt(t.min)}–${fmt(t.max)}s`;
    const me = rt != null && rt >= t.min && rt < t.max ? ' me' : '';
    return `<div class="tier${me}"><span class="r">${range}</span><span class="n">${t.name}${me ? '　← 你在這' : ''}</span><span class="d">${t.desc}</span></div>`;
  }).join('');
}
renderLadder(null);

function updateStats() {
  bestEl.textContent = fmt(Math.min(...results));
  avgEl.textContent = fmt(results.reduce((a, b) => a + b, 0) / results.length);
  countEl.textContent = results.length;
}

// 名字：輸入並確定後才出現截圖按鈕；在輸入框打空白鍵不觸發計時
function confirmName() {
  playerName = nameInput.value.trim();
  if (!playerName) { nameInput.focus(); return; }
  shotBtn.classList.add('show');
  nameInput.blur();
}
document.getElementById('nameOk').addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') confirmName(); });
['pointerdown', 'click'].forEach(ev => namebox.addEventListener(ev, e => e.stopPropagation()));

// ===== 結果截圖：用 canvas 畫成績卡，手機走分享、電腦直接下載 =====
const shotBtn = document.getElementById('shot');
['pointerdown', 'click', 'keydown'].forEach(ev => shotBtn.addEventListener(ev, e => e.stopPropagation()));
shotBtn.addEventListener('click', shareResult);

async function drawCard() {
  // 手機直式 9:16
  const W = 1080, H = 1920, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const t = tierOf(lastRt);
  const best = Math.min(...results), avg = results.reduce((a, b) => a + b, 0) / results.length;
  const font = '"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif';
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  const loadSVG = svg => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });

  // 背景
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#111116'); bg.addColorStop(1, '#07070a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // 標題
  g.textAlign = 'center'; g.fillStyle = '#9a9aa2'; g.font = `600 40px ${font}`;
  g.fillText('F1 起跑反應測試', W / 2, 120);

  // 燈架：全亮紅燈＋光暈
  const gx = 110, gy = 160, gw = W - 220, gh = 250;
  g.fillStyle = '#1a1a1f'; rr(gx, gy, gw, gh, 24); g.fill();
  g.strokeStyle = '#2c2c33'; g.lineWidth = 3; g.stroke();
  const lampR = 42, colGap = gw / 5;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) {
    const x = gx + colGap * (i + 0.5), y = gy + 72 + j * 106;
    g.save(); g.shadowColor = '#ff1e1e'; g.shadowBlur = 50;
    g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.fillStyle = '#ff1e1e'; g.fill(); g.restore();
    g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.lineWidth = 5; g.strokeStyle = '#111'; g.stroke();
    const hl = g.createRadialGradient(x - 14, y - 16, 3, x, y, lampR);
    hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.fillStyle = hl; g.fill();
  }

  // 賽車
  const carImg = await loadSVG(carSVG(car));
  const cw = 680, ch = cw * 128 / 400;
  g.drawImage(carImg, (W - cw) / 2, 440, cw, ch);

  // 頒獎台
  const podImg = await loadSVG(podiumSVG(tierIndex(lastRt), car).replace(' class="podium"', ''));
  const pw = 640, ph = pw * 210 / 300;
  rr((W - pw) / 2 - 16, 670 - 12, pw + 32, ph + 24, 20); g.fillStyle = '#0f0f13'; g.fill();
  g.drawImage(podImg, (W - pw) / 2, 670, pw, ph);

  // 名字 · 車隊
  g.fillStyle = '#fff'; g.font = `700 56px ${font}`;
  g.fillText(playerName, W / 2, 1210);
  g.fillStyle = labelColor(car); g.font = `800 40px ${font}`;
  g.fillText(car.en, W / 2, 1262);

  // 成績
  const color = lastRt < 200 ? '#3ddc84' : lastRt < 300 ? '#ffffff' : '#ff5252';
  g.fillStyle = color; g.font = `800 190px ${font}`;
  g.fillText(`${fmt(lastRt)}s`, W / 2, 1450);

  // 等級
  g.fillStyle = '#3ddc84'; g.font = `700 56px ${font}`;
  g.fillText(t.name, W / 2, 1535);
  g.fillStyle = '#8a8a92'; g.font = `30px ${font}`;
  wrapText(g, t.desc, W / 2, 1585, W - 200, 42);

  // 統計列
  rr(120, 1680, W - 240, 130, 22); g.fillStyle = '#15151a'; g.fill();
  const cols = [['最佳', `${fmt(best)}s`], ['平均', `${fmt(avg)}s`], ['次數', `${results.length}`]];
  cols.forEach(([k, v], i) => {
    const x = 120 + (W - 240) / 6 * (2 * i + 1);
    g.fillStyle = '#8a8a92'; g.font = `28px ${font}`; g.fillText(k, x, 1726);
    g.fillStyle = '#fff'; g.font = `700 44px ${font}`; g.fillText(v, x, 1782);
  });

  // 日期與署名
  g.textAlign = 'left'; g.fillStyle = '#55555c'; g.font = `24px ${font}`;
  g.fillText(new Date().toLocaleString('zh-TW', { hour12: false }), 90, H - 50);
  g.textAlign = 'right'; g.font = `22px ${font}`;
  g.fillText('Generated by Gary Fan', W - 90, H - 50);
  return c;
}
function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW) { g.fillText(line, x, y); line = ch; y += lh; }
    else line += ch;
  }
  if (line) g.fillText(line, x, y);
}

async function shareResult() {
  if (lastRt == null) return;
  const canvas = await drawCard();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], `f1-${playerName}-${fmt(lastRt)}s.png`, { type: 'image/png' });
  // 手機：系統分享面板（LINE、存到相簿…）
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'F1 起跑反應測試', text: `${playerName}（${car.en}）反應時間 ${fmt(lastRt)}s，${tierOf(lastRt).name}！` }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // 電腦：直接下載 PNG
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// 只有紅色啟動鍵觸發：pointerdown 比 click 早觸發，延遲更低；滑動畫面其他地方不會觸發
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('pointerdown', e => { e.preventDefault(); startBtn.classList.add('down'); press(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => startBtn.addEventListener(ev, () => startBtn.classList.remove('down')));
startBtn.addEventListener('click', e => e.preventDefault());   // 已在 pointerdown 處理，避免重複
startBtn.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); });
// 鍵盤：空白鍵 / Enter 仍可用（電腦）
window.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
});
</script>
