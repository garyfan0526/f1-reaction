<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 五燈反應測試器</title>
<style>
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 28px 0 40px;
    background: #0b0b0e; color: #eee; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  body > * { flex-shrink: 0; }
  h1 { font-weight: 600; letter-spacing: 2px; margin: 0 0 24px; font-size: 22px; color: #bbb; }
  .gantry { background: #1a1a1f; padding: 24px 28px; border-radius: 14px; box-shadow: 0 10px 40px #000; display: flex; gap: 22px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lamp { width: 64px; height: 64px; border-radius: 50%; background: #2a2a30; border: 4px solid #111; transition: background .05s; }
  .col.on .lamp { background: #ff1e1e; box-shadow: 0 0 22px #ff1e1e, 0 0 50px #ff000080; }
  /* F1 方向盤風格紅色啟動鍵 */
  .start-wrap { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start {
    width: 120px; height: 120px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 38% 32%, #ff6b6b 0%, #e60000 45%, #8f0000 100%);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 10px 24px #000, inset 0 -6px 12px #5a0000, inset 0 4px 8px #ff9a9a80;
    color: #fff; font-weight: 800; font-size: 18px; letter-spacing: 2px; font-family: inherit;
    transition: transform .05s, box-shadow .05s;
  }
  .start:active, .start.down {
    transform: translateY(3px);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 4px 10px #000, inset 0 -2px 6px #5a0000, inset 0 6px 12px #3a0000;
  }
  .start:focus-visible { outline: 2px solid #3ddc84; outline-offset: 14px; }
  .start small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .85; margin-top: 2px; }
  .status { margin-top: 24px; font-size: 28px; min-height: 110px; text-align: center; }
  .time { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ok { color: #3ddc84; } .bad { color: #ff5252; } .dim { color: #888; font-size: 18px; }
  .stats { margin-top: 18px; display: flex; gap: 30px; color: #aaa; font-size: 15px; }
  .stats b { color: #fff; font-size: 20px; }
  .hint { margin-top: 26px; color: #666; font-size: 14px; }
  .ladder { margin-top: 22px; width: min(560px, 92vw); border-radius: 10px; overflow: hidden; border: 1px solid #26262c; }
  .tier { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 12px; font-size: 13px; color: #888; border-bottom: 1px solid #1c1c22; background: #121216; }
  .tier:last-child { border-bottom: 0; }
  .tier .r { font-variant-numeric: tabular-nums; color: #aaa; }
  .tier .n { color: #ccc; }
  .tier .d { grid-column: 2; font-size: 11px; color: #666; }
  .tier.me { background: #1f2a1f; border-left: 4px solid #3ddc84; color: #fff; }
  .tier.me .n, .tier.me .r { color: #fff; font-weight: 600; }
  .tier.me .d { color: #9fd9b4; }
  .btn { margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 1px solid #3ddc84; background: transparent; color: #3ddc84; font-size: 15px; cursor: pointer; display: none; }
  .btn:hover { background: #3ddc8422; }
  .btn.show { display: inline-block; }
  .note { margin-top: 8px; color: #555; font-size: 11px; width: min(560px, 92vw); text-align: center; }
  /* 選車畫面 */
  .overlay { position: fixed; inset: 0; background: #0b0b0ef2; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .overlay.hide { display: none; }
  .overlay h2 { margin: 0 0 18px; font-weight: 600; letter-spacing: 2px; color: #ddd; font-size: 22px; }
  .cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(640px, 94vw); }
  .car { background: #15151a; border: 2px solid #26262c; border-radius: 14px; padding: 14px 12px 10px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s; }
  .car:hover, .car:active { transform: translateY(-3px); border-color: var(--c); }
  .car svg { width: 100%; height: auto; display: block; }
  .car .nm { margin-top: 8px; font-size: 16px; font-weight: 600; color: var(--c); }
  .car .en { font-size: 11px; color: #666; letter-spacing: 1px; }
  /* 標題旁的小車 */
  .mycar { display: flex; align-items: center; gap: 10px; margin: -10px 0 16px; color: #999; font-size: 13px; }
  .mycar svg { width: 110px; height: auto; }
  .mycar a { color: #666; text-decoration: underline; cursor: pointer; font-size: 12px; }
  /* 結果區的車與名字 */
  .result-car { display: none; flex-direction: column; align-items: center; margin-top: 14px; }
  .result-car.show { display: flex; }
  .result-car svg { width: min(320px, 80vw); height: auto; }
  .result-car .team { font-weight: 700; font-size: 18px; margin-top: 4px; }
  .namebox { display: none; margin-top: 14px; align-items: center; gap: 8px; }
  .namebox.show { display: flex; }
  .namebox input { background: #15151a; border: 1px solid #333; color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 16px; width: 170px; font-family: inherit; }
  .namebox input:focus { outline: 1px solid #3ddc84; }
  .namebox button { padding: 9px 16px; border-radius: 8px; border: 0; background: #3ddc84; color: #000; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
  @media (max-width: 520px) { .lamp { width: 44px; height: 44px; } .gantry { gap: 12px; padding: 16px; } .time { font-size: 48px; } }
</style>
</head>
<body>
  <div class="overlay" id="overlay">
    <h2>選擇你的賽車</h2>
    <div class="cars" id="cars"></div>
  </div>
  <h1>F1 五燈反應測試</h1>
  <div class="mycar" id="mycar"></div>
  <div class="gantry" id="gantry">
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
  </div>
  <div class="start-wrap">
    <button class="start" id="startBtn" aria-label="啟動">START<small>PUSH</small></button>
  </div>
  <div class="status" id="status"><span class="dim">按紅色啟動鍵或空白鍵開始</span></div>
  <div class="stats">
    <div>最佳 <b id="best">--</b> s</div>
    <div>平均 <b id="avg">--</b> s</div>
    <div>次數 <b id="count">0</b></div>
  </div>
  <div class="result-car" id="resultCar"></div>
  <div class="namebox" id="namebox">
    <input id="nameInput" type="text" maxlength="12" placeholder="輸入你的名字" autocomplete="off">
    <button id="nameOk">確定</button>
  </div>
  <button class="btn" id="shot">📷 截圖分享成績</button>
  <div class="ladder" id="ladder"></div>
  <div class="note">對照用的是 F1 轉播「熄燈→車子開始動」的時間；Bottas 2019 日本站自述的 0.04s 是離合器撥片動作，不列入。</div>
  <div class="hint">選車 → 按紅鍵開始 → 五燈依序亮起 → 全部熄滅的瞬間再按一次紅鍵。燈熄滅前就按 = 偷跑(Jump Start)。滑動畫面不會觸發。</div>
  <div class="sig">Generated by Gary Fan</div>

<script>
const cols = [...document.querySelectorAll('.col')];
const statusEl = document.getElementById('status');
const bestEl = document.getElementById('best'), avgEl = document.getElementById('avg'), countEl = document.getElementById('count');

// 狀態機：idle → lighting(亮燈中) → armed(全亮，等隨機延遲) → go(已熄滅，計時中) → result
let state = 'idle';
let timers = [];
let lightsOutAt = 0;
let results = [];
let car = null;        // 目前選的車
let playerName = '';

// 四台車：代表色，不是真車，只求一眼認得出來
const CARS = [
  { id: 'redbull',  name: '紅牛',   en: 'RED BULL', body: '#1e2a78', accent: '#ffd400', accent2: '#e8002d', wing: '#0f1540' },
  { id: 'ferrari',  name: '法拉利', en: 'FERRARI',  body: '#dc0000', accent: '#ffffff', accent2: '#ffd400', wing: '#8a0000' },
  { id: 'mclaren',  name: '麥拉倫', en: 'McLAREN',  body: '#ff8000', accent: '#111111', accent2: '#47c7fc', wing: '#1a1a1a' },
  { id: 'mercedes', name: '賓士',   en: 'MERCEDES', body: '#c8ccd0', accent: '#00d2be', accent2: '#111111', wing: '#111111' },
];
const labelColor = c => c.accent === '#ffffff' ? c.body : c.accent;
// 側面 F1 車剪影 SVG
function carSVG(c) {
  return `<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="160" cy="100" rx="140" ry="5" fill="#000" opacity=".5"/>
    <rect x="10" y="22" width="34" height="8" rx="2" fill="${c.wing}"/>
    <rect x="12" y="30" width="6" height="30" fill="${c.wing}"/>
    <rect x="8" y="36" width="38" height="7" rx="2" fill="${c.accent}"/>
    <path d="M22 62 L60 50 L120 46 L150 40 L185 40 L215 50 L260 56 L300 60 L300 72 L22 72 Z" fill="${c.body}"/>
    <path d="M60 50 L120 46 L150 40 L185 40 L215 50 L190 54 L120 56 Z" fill="${c.accent}" opacity=".85"/>
    <path d="M90 56 L190 56 L200 72 L80 72 Z" fill="${c.wing}" opacity=".9"/>
    <rect x="95" y="60" width="90" height="4" fill="${c.accent2}"/>
    <path d="M150 40 L158 28 L185 28 L190 40 Z" fill="#111"/>
    <path d="M152 36 Q170 18 192 36" stroke="#222" stroke-width="4" fill="none"/>
    <circle cx="171" cy="34" r="5" fill="${c.accent}"/>
    <path d="M140 42 L150 24 L158 28 L150 40 Z" fill="${c.body}"/>
    <rect x="262" y="70" width="52" height="7" rx="2" fill="${c.wing}"/>
    <rect x="268" y="64" width="46" height="4" rx="2" fill="${c.accent}"/>
    <circle cx="68" cy="78" r="19" fill="#111"/><circle cx="68" cy="78" r="9" fill="#333"/><circle cx="68" cy="78" r="3" fill="${c.accent}"/>
    <circle cx="248" cy="78" r="19" fill="#111"/><circle cx="248" cy="78" r="9" fill="#333"/><circle cx="248" cy="78" r="3" fill="${c.accent}"/>
    <text x="112" y="68" font-size="9" font-weight="700" fill="#fff" font-family="Arial">${c.en}</text>
  </svg>`;
}
const overlay = document.getElementById('overlay');
document.getElementById('cars').innerHTML = CARS.map(c =>
  `<div class="car" data-id="${c.id}" style="--c:${labelColor(c)}">${carSVG(c)}<div class="nm">${c.name}</div><div class="en">${c.en}</div></div>`).join('');
document.querySelectorAll('.car').forEach(el => el.addEventListener('click', () => chooseCar(el.dataset.id)));
function chooseCar(id) {
  car = CARS.find(c => c.id === id);
  overlay.classList.add('hide');
  document.getElementById('mycar').innerHTML = `${carSVG(car)}<div>你的車：<b style="color:#fff">${car.name}</b><br><a id="changeCar">換車</a></div>`;
  document.getElementById('changeCar').addEventListener('click', () => { clearTimers(); setLights(0); state = 'idle'; show('<span class="dim">按紅色啟動鍵或空白鍵開始</span>'); hideResultExtras(); overlay.classList.remove('hide'); });
}
const resultCar = document.getElementById('resultCar'), namebox = document.getElementById('namebox'), nameInput = document.getElementById('nameInput');
function hideResultExtras() { resultCar.classList.remove('show'); namebox.classList.remove('show'); shotBtn.classList.remove('show'); }

let lastRt = null;
const fmt = ms => (ms / 1000).toFixed(2);   // 轉播格式：0.21

function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function setLights(n) { cols.forEach((c, i) => c.classList.toggle('on', i < n)); }
function show(html) { statusEl.innerHTML = html; }

function start() {
  clearTimers();
  hideResultExtras();
  state = 'lighting';
  setLights(0);
  show('<span class="dim">準備…</span>');
  // 每 1 秒亮一盞，共 5 盞
  for (let i = 1; i <= 5; i++) {
    timers.push(setTimeout(() => setLights(i), i * 1000));
  }
  // 第 5 燈亮起後，隨機 0.2~3 秒(真實 F1 規則)全滅
  const hold = 200 + Math.random() * 2800;
  timers.push(setTimeout(() => { state = 'armed'; }, 5000));
  timers.push(setTimeout(() => {
    setLights(0);
    lightsOutAt = performance.now();   // 以熄燈那一刻為基準
    state = 'go';
  }, 5000 + hold));
}

function press() {
  if (!car) return;                                   // 還沒選車
  if (state === 'idle' || state === 'result') { start(); return; }
  if (state === 'lighting' || state === 'armed') {        // 燈還沒滅就按
    clearTimers(); setLights(0); state = 'result';
    show('<span class="bad">偷跑！JUMP START</span><br><span class="dim">再按一次重來</span>');
    return;
  }
  if (state === 'go') {
    const rt = Math.round(performance.now() - lightsOutAt);
    state = 'result';
    results.push(rt);
    const cls = rt < 200 ? 'ok' : rt < 300 ? '' : 'bad';
    show(`<div class="time ${cls}">${fmt(rt)}<span style="font-size:.5em">s</span></div><span class="dim">${grade(rt)}　再按一次重來</span>`);
    updateStats();
    renderLadder(rt);
    lastRt = rt;
    resultCar.innerHTML = `${carSVG(car)}<div class="team" style="color:${labelColor(car)}">${car.name}</div>`;
    resultCar.classList.add('show');
    nameInput.value = playerName;
    namebox.classList.add('show');
    if (playerName) shotBtn.classList.add('show');   // 已輸入過名字就直接出現
    else setTimeout(() => nameInput.focus(), 50);
  }
}

// 等級階梯（來源：FIA / F1 官方 / Motorsport.com 轉播數據）
const TIERS = [
  { min: 0,   max: 100, name: '超越人類極限', desc: '比燈還快，F1 會直接判偷跑。你大概是猜的。' },
  { min: 100, max: 150, name: '裁判盯上你了', desc: 'FIA 把車動低於 0.2s 視為可疑；這區間幾乎只有預判做得到。' },
  { min: 150, max: 200, name: '傳奇起跑', desc: 'Bottas 2017 奧地利 0.201s，對手質疑偷跑、FIA 判合法。你比他還快。' },
  { min: 200, max: 250, name: 'F1 頂尖起跑者', desc: '轉播顯示頂尖起跑多落在 0.20–0.25s，F1 官方說車手平均約 0.2s。' },
  { min: 250, max: 300, name: 'F1 車手水準', desc: '正規 F1 車手常見區間，能站上發車格。' },
  { min: 300, max: 350, name: '一般人平均', desc: '人類平均反應約 0.30s。' },
  { min: 350, max: 500, name: '起跑被超車', desc: '熄燈後慢半拍，旁邊的車已經先衝。' },
  { min: 500, max: Infinity, name: '還在看燈', desc: '多練幾次會進步，這很正常。' },
];
function tierOf(rt) { return TIERS.find(t => rt >= t.min && rt < t.max); }
function grade(rt) { return tierOf(rt).name; }
function renderLadder(rt) {
  document.getElementById('ladder').innerHTML = TIERS.map(t => {
    const range = t.max === Infinity ? `${fmt(t.min)}s 以上` : `${fmt(t.min)}–${fmt(t.max)}s`;
    const me = rt != null && rt >= t.min && rt < t.max ? ' me' : '';
    return `<div class="tier${me}"><span class="r">${range}</span><span class="n">${t.name}${me ? '　← 你在這' : ''}</span><span class="d">${t.desc}</span></div>`;
  }).join('');
}
renderLadder(null);

function updateStats() {
  bestEl.textContent = fmt(Math.min(...results));
  avgEl.textContent = fmt(results.reduce((a, b) => a + b, 0) / results.length);
  countEl.textContent = results.length;
}

// 名字：輸入並確定後才出現截圖按鈕；在輸入框打空白鍵不觸發計時
function confirmName() {
  playerName = nameInput.value.trim();
  if (!playerName) { nameInput.focus(); return; }
  shotBtn.classList.add('show');
  nameInput.blur();
}
document.getElementById('nameOk').addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') confirmName(); });
['pointerdown', 'click'].forEach(ev => namebox.addEventListener(ev, e => e.stopPropagation()));

// ===== 結果截圖：用 canvas 畫成績卡，手機走分享、電腦直接下載 =====
const shotBtn = document.getElementById('shot');
['pointerdown', 'click', 'keydown'].forEach(ev => shotBtn.addEventListener(ev, e => e.stopPropagation()));
shotBtn.addEventListener('click', shareResult);

async function drawCard() {
  const W = 900, H = 600, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const t = tierOf(lastRt);
  const best = Math.min(...results), avg = results.reduce((a, b) => a + b, 0) / results.length;
  const font = '"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif';

  g.fillStyle = '#0b0b0e'; g.fillRect(0, 0, W, H);
  // 燈架
  g.fillStyle = '#1a1a1f';
  g.beginPath(); g.roundRect(60, 40, W - 120, 120, 16); g.fill();
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) {
    const x = 60 + 78 + i * 156, y = 40 + 30 + j * 60;
    g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2);
    g.fillStyle = '#2a2a30'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#111'; g.stroke();
  }
  // 賽車
  const img = new Image();
  await new Promise(res => { img.onload = res; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(carSVG(car)); });
  g.drawImage(img, W / 2 - 180, 168, 360, 124);
  // 名字 + 車隊
  g.fillStyle = '#fff'; g.font = `700 30px ${font}`; g.textAlign = 'center';
  g.fillText(`${playerName}　${car.name}`, W / 2, 322);
  // 成績
  const color = lastRt < 200 ? '#3ddc84' : lastRt < 300 ? '#ffffff' : '#ff5252';
  g.fillStyle = color; g.font = `700 110px ${font}`;
  g.fillText(`${fmt(lastRt)}s`, W / 2, 420);
  // 等級
  g.fillStyle = '#3ddc84'; g.font = `600 34px ${font}`;
  g.fillText(t.name, W / 2, 462);
  g.fillStyle = '#888'; g.font = `18px ${font}`;
  g.fillText(t.desc, W / 2, 492);
  // 統計
  g.fillStyle = '#aaa'; g.font = `20px ${font}`;
  g.fillText(`最佳 ${fmt(best)}s　　平均 ${fmt(avg)}s　　次數 ${results.length}`, W / 2, 540);
  // 日期與署名
  g.textAlign = 'left'; g.fillStyle = '#555'; g.font = `14px ${font}`;
  g.fillText(new Date().toLocaleString('zh-TW', { hour12: false }), 60, H - 20);
  g.textAlign = 'right'; g.font = `12px ${font}`;
  g.fillText('Generated by Gary Fan', W - 60, H - 20);
  return c;
}

async function shareResult() {
  if (lastRt == null) return;
  const canvas = await drawCard();
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const file = new File([blob], `f1-${playerName}-${fmt(lastRt)}s.png`, { type: 'image/png' });
  // 手機：系統分享面板（LINE、存到相簿…）
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'F1 五燈反應測試', text: `${playerName}（${car.name}）反應時間 ${fmt(lastRt)}s，${tierOf(lastRt).name}！` }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // 電腦：直接下載 PNG
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// 只有紅色啟動鍵觸發：pointerdown 比 click 早觸發，延遲更低；滑動畫面其他地方不會觸發
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('pointerdown', e => { e.preventDefault(); startBtn.classList.add('down'); press(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => startBtn.addEventListener(ev, () => startBtn.classList.remove('down')));
startBtn.addEventListener('click', e => e.preventDefault());   // 已在 pointerdown 處理，避免重複
startBtn.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); });
// 鍵盤：空白鍵 / Enter 仍可用（電腦）
window.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
});
</script>
