<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>F1 車手體檢</title>
<meta property="og:title" content="F1 車手體檢">
<meta property="og:description" content="選車、闖關：起跑反應、反應燈板、接尺測試，測你的車手反應，看總分能站上頒獎台哪一階。">
<meta property="og:type" content="website">
<meta name="description" content="F1 車手體檢：起跑反應、反應燈板等關卡，總分決定頒獎台位置。">
<style>
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; padding: 24px 0 40px;
    background: #0b0b0e; color: #eee; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;   /* 關掉雙擊縮放 */
  }
  body > * { flex-shrink: 0; }
  h1 { font-weight: 600; letter-spacing: 2px; margin: 0 0 14px; font-size: 22px; color: #bbb; }
  h1 small { display: block; font-size: 12px; color: #666; letter-spacing: 1px; font-weight: 500; margin-top: 4px; }
  .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
  .screen.show { display: flex; }
  .ok { color: #3ddc84; } .bad { color: #ff5252; } .dim { color: #888; font-size: 18px; }
  .linkbtn { color: #777; text-decoration: underline; cursor: pointer; font-size: 13px; background: none; border: 0; font-family: inherit; }
  .btn { margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 1px solid #3ddc84; background: transparent; color: #3ddc84; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #3ddc8422; }
  .btn.solid { background: #3ddc84; color: #000; font-weight: 700; }
  .btn.ghost { border-color: #444; color: #aaa; }
  .btn[disabled] { opacity: .35; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  /* 選車 */
  .overlay { position: fixed; inset: 0; background: #0b0b0ef2; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .overlay.hide { display: none; }
  .overlay .ov-title { font-size: 30px; font-weight: 800; letter-spacing: 4px; color: #fff; margin-bottom: 6px; }
  .overlay h2 { margin: 0 0 18px; font-weight: 500; letter-spacing: 2px; color: #9a9aa2; font-size: 16px; }
  .cars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(640px, 94vw); }
  .car { background: #15151a; border: 2px solid #26262c; border-radius: 14px; padding: 14px 12px 10px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s; }
  .car:hover, .car:active { transform: translateY(-3px); border-color: var(--c); }
  .car svg { width: 100%; height: auto; display: block; }
  .car .nm { margin-top: 8px; font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--c); }
  .mycar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: #999; font-size: 13px; }
  .mycar svg { width: 110px; height: auto; }
  /* 關卡選單 */
  .stages { display: grid; grid-template-columns: 1fr; gap: 12px; width: min(420px, 92vw); }
  .stage { background: #15151a; border: 2px solid #26262c; border-radius: 14px; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .stage:hover, .stage:active { border-color: #3ddc84; }
  .stage .sn { grid-column: 1; grid-row: 1; font-size: 18px; font-weight: 700; color: #fff; }
  .stage .sd { grid-column: 1; grid-row: 2; font-size: 12px; color: #777; }
  .stage .sb { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-size: 13px; color: #888; align-self: center; }
  .stage .sb b { display: block; font-size: 22px; color: #3ddc84; }
  .stage .sb .tn { color: #bbb; font-size: 12px; }
  .total { margin-top: 20px; text-align: center; color: #888; font-size: 14px; }
  .total b { display: block; font-size: 46px; color: #fff; font-weight: 800; line-height: 1.1; }
  /* 共用：紅鍵 */
  .start-wrap { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .start {
    width: 120px; height: 120px; border-radius: 50%; border: 0; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 38% 32%, #ff6b6b 0%, #e60000 45%, #8f0000 100%);
    box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 10px 24px #000, inset 0 -6px 12px #5a0000, inset 0 4px 8px #ff9a9a80;
    color: #fff; font-weight: 800; font-size: 18px; letter-spacing: 2px; font-family: inherit;
    transition: transform .05s, box-shadow .05s;
  }
  .start:active, .start.down { transform: translateY(3px); box-shadow: 0 0 0 7px #2a2a30, 0 0 0 10px #55555e, 0 4px 10px #000, inset 0 -2px 6px #5a0000, inset 0 6px 12px #3a0000; }
  .start small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .85; margin-top: 2px; }
  .status { margin-top: 18px; font-size: 28px; min-height: 60px; text-align: center; }
  #scrStart .start-wrap { margin-top: 34px; }
  #scrBatak .status { margin-top: 12px; min-height: 40px; }
  .time { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score { font-size: 15px; color: #3ddc84; margin-top: 4px; }
  /* 關卡 1：五燈 */
  .gantry { background: #1a1a1f; padding: 24px 28px; border-radius: 14px; box-shadow: 0 10px 40px #000; display: flex; gap: 22px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .lamp { width: 64px; height: 64px; border-radius: 50%; background: #2a2a30; border: 4px solid #111; transition: background .05s; }
  .col.on .lamp { background: #ff1e1e; box-shadow: 0 0 22px #ff1e1e, 0 0 50px #ff000080; }
  /* 關卡 2：燈板 */
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(340px, 88vw); background: #1a1a1f; padding: 14px; border-radius: 14px; box-shadow: 0 10px 40px #000; }
  .board.live { touch-action: none; }
  .cell { aspect-ratio: 1; border-radius: 50%; background: #2a2a30; border: 4px solid #111; transition: background .04s; }
  .cell.on { background: #ff1e1e; box-shadow: 0 0 22px #ff1e1e, 0 0 50px #ff000080; }
  .cell.hit { background: #3ddc84; box-shadow: 0 0 18px #3ddc84; }
  .bk-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 14px; }
  .bk-row .start-wrap { margin-top: 0; }
  .bk-row .start { width: 84px; height: 84px; font-size: 14px; box-shadow: 0 0 0 5px #2a2a30, 0 0 0 8px #55555e, 0 8px 18px #000, inset 0 -5px 10px #5a0000, inset 0 3px 6px #ff9a9a80; }
  .bk-row .start small { font-size: 9px; }
  .hud { display: flex; gap: 18px; color: #888; font-size: 13px; }
  .hud b { color: #fff; font-size: 22px; display: block; font-variant-numeric: tabular-nums; }
  /* 關卡 3：接尺 */
  .rstage { position: relative; width: min(320px, 88vw); height: 400px; overflow: hidden; }
  .rstage.live { touch-action: none; }
  .rglove { position: absolute; left: 50%; bottom: 0; width: 240px; margin-left: -110px; pointer-events: none; }   /* 中心偏右 10px */
  .rruler { position: absolute; left: 0; width: 40px; height: 232px; top: -232px; background: #f5d57a; border-radius: 4px; border: 2px solid #c9a94a; will-change: top; transition: opacity .2s; }
  .rruler i { position: absolute; left: 0; height: 2px; background: #6b5620; }
  .rruler b { position: absolute; right: 5px; font-size: 9px; color: #4a3a10; transform: translateY(-5px); font-style: normal; }
  .rstage.done .rruler { opacity: .3; }
  .rmsg { position: absolute; left: 0; right: 190px; top: 10px; text-align: center; font-size: 15px; color: #888; line-height: 1.4; }
  .rhit { position: absolute; inset: 0; }
  #scrRuler .status { margin-top: 10px; min-height: 40px; }
  /* 階梯 */
  .ladder { margin-top: 18px; width: min(560px, 92vw); border-radius: 10px; overflow: hidden; border: 1px solid #26262c; }
  .tier { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 7px 12px; font-size: 13px; color: #888; border-bottom: 1px solid #1c1c22; background: #121216; }
  .tier:last-child { border-bottom: 0; }
  .tier .r { font-variant-numeric: tabular-nums; color: #aaa; }
  .tier .n { color: #ccc; }
  .tier .d { grid-column: 2; font-size: 11px; color: #666; }
  .tier.me { background: #1f2a1f; border-left: 4px solid #3ddc84; color: #fff; }
  .tier.me .n, .tier.me .r { color: #fff; font-weight: 600; }
  .tier.me .d { color: #9fd9b4; }
  /* 頒獎台頁 */
  .final-score { text-align: center; color: #888; font-size: 14px; margin-top: 0; display: flex; align-items: baseline; gap: 10px; }
  .final-score b { font-size: 48px; color: #fff; font-weight: 800; line-height: 1; }
  .final-score span { color: #3ddc84; font-size: 18px; font-weight: 700; }
  .result-car { display: flex; flex-direction: column; align-items: center; margin-top: 4px; }
  .podium { width: min(300px, 78vw); margin-top: 4px; border-radius: 12px; background: #0f0f13; }
  .breakdown { width: min(360px, 90vw); margin-top: 8px; border: 1px solid #26262c; border-radius: 10px; overflow: hidden; }
  .bk { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding: 6px 12px; background: #121216; border-bottom: 1px solid #1c1c22; font-size: 14px; color: #bbb; }
  .bk:last-child { border-bottom: 0; }
  .bk .v { color: #fff; font-variant-numeric: tabular-nums; }
  .bk .p { color: #3ddc84; font-weight: 700; min-width: 48px; text-align: right; }
  .bk.none { color: #555; } .bk.none .v, .bk.none .p { color: #555; }
  .namebox { display: none; margin-top: 10px; align-items: center; gap: 8px; }
  .namebox.show { display: flex; }
  .namebox input { background: #15151a; border: 1px solid #333; color: #fff; padding: 9px 12px; border-radius: 8px; font-size: 16px; width: 170px; font-family: inherit; }
  .namebox input:focus { outline: 1px solid #3ddc84; }
  .namebox button { padding: 9px 16px; border-radius: 8px; border: 0; background: #3ddc84; color: #000; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  #shot { display: none; margin-top: 8px; } #shot.show { display: inline-block; }
  #scrFinal .row { margin-top: 2px; } #scrFinal .row .btn { margin-top: 6px; padding: 6px 16px; font-size: 13px; }
  .sig { position: fixed; right: 10px; bottom: 6px; font-size: 10px; color: #555; }
  .mute { position: fixed; top: 10px; right: 10px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; background: #15151a; color: #ccc; font-size: 18px; cursor: pointer; }
  @media (max-width: 520px) { .lamp { width: 44px; height: 44px; } .gantry { gap: 12px; padding: 16px; } .time { font-size: 48px; } body { padding-top: 14px; } h1 { margin-bottom: 8px; font-size: 20px; } #scrStart .start-wrap { margin-top: 26px; } #scrStart .start { width: 104px; height: 104px; font-size: 16px; } }
</style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="ov-title">F1 車手體檢</div>
    <h2>選擇你的賽車</h2>
    <div class="cars" id="cars"></div>
  </div>

  <button class="mute" id="muteBtn" aria-label="音效">🔊</button>
  <h1 id="h1">F1 車手體檢<small id="h1sub"></small></h1>
  <div class="mycar" id="mycar"></div>

  <!-- 關卡選單 -->
  <section class="screen" id="scrMenu">
    <div class="stages" id="stages"></div>
    <div class="total">目前總分<b id="totalScore">--</b><span id="totalHint">完成任一關即可看頒獎台</span></div>
    <div class="row">
      <button class="btn solid" id="toFinal">看頒獎台</button>
    </div>
    <button class="linkbtn" id="resetAll" style="margin-top:18px">重新開始（清除成績）</button>
  </section>

  <!-- 關卡 1：起跑反應 -->
  <section class="screen" id="scrStart">
    <div class="gantry">
      <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="col"><div class="lamp"></div><div class="lamp"></div></div>
    </div>
    <div class="start-wrap"><button class="start" id="startBtn" aria-label="啟動">START<small>PUSH</small></button></div>
    <div class="status" id="statusStart"><span class="dim">按紅鍵開始，五燈熄滅瞬間再按</span></div>
    <div class="row"><button class="btn ghost" data-back>回選單</button></div>
    <div class="ladder" id="ladderStart"></div>
  </section>

  <!-- 關卡 2：反應燈板 -->
  <section class="screen" id="scrBatak">
    <div class="board" id="board"></div>
    <div class="bk-row">
      <div class="hud"><div>剩餘<b id="bkTime">10.0</b></div><div>打中<b id="bkHits">0</b></div><div>誤點<b id="bkMiss">0</b></div></div>
      <div class="start-wrap"><button class="start" id="batakBtn" aria-label="啟動">START<small>PUSH</small></button></div>
    </div>
    <div class="status" id="statusBatak"><span class="dim">按紅鍵開始，10 秒內點掉亮起的燈</span></div>
    <div class="row"><button class="btn ghost" data-back>回選單</button></div>
    <div class="ladder" id="ladderBatak"></div>
  </section>

  <!-- 關卡 3：接尺 -->
  <section class="screen" id="scrRuler">
    <div class="rstage" id="rstage">
      <div class="rmsg" id="rmsg">按紅鍵準備，尺掉下來立刻點畫面</div>
      <div class="rruler" id="rruler"></div>
      <div class="rglove" id="rglove"></div>
      <div class="rhit" id="rhit"></div>
    </div>
    <div class="bk-row">
      <div class="hud"><div>本次<b id="rkCm">--</b></div><div>秒數<b id="rkSec">--</b></div></div>
      <div class="start-wrap"><button class="start" id="rulerBtn" aria-label="啟動">START<small>PUSH</small></button></div>
    </div>
    <div class="status" id="statusRuler"><span class="dim">按紅鍵準備，尺掉下來立刻點畫面或按紅鍵</span></div>
    <div class="row"><button class="btn ghost" data-back>回選單</button></div>
    <div class="ladder" id="ladderRuler"></div>
  </section>

  <!-- 頒獎台 -->
  <section class="screen" id="scrFinal">
    <div class="final-score">總分<b id="finalScore">--</b><span id="finalGrade"></span></div>
    <div class="result-car" id="resultCar"></div>
    <div class="breakdown" id="breakdown"></div>
    <div class="namebox" id="namebox">
      <input id="nameInput" type="text" maxlength="12" placeholder="輸入你的名字" autocomplete="off">
      <button id="nameOk">確定</button>
    </div>
    <button class="btn" id="shot">📷 截圖分享成績</button>
    <div class="row"><button class="btn ghost" data-back>回選單</button></div>
  </section>

  <div class="sig">Generated by Gary Fan</div>

<script>
// ============ 車、安全帽、頒獎台 SVG ============
const CARS = [
  // body 主色 / accent 主要點綴 / accent2 次要點綴 / dark 翼片與側箱深色 / tyre 輪胎側壁色帶
  { id: 'redbull',  en: 'RED BULL', body: '#121f4e', accent: '#e10600', accent2: '#ffd300', dark: '#0a1232', text: '#ffffff' },
  { id: 'ferrari',  en: 'FERRARI',  body: '#e8002d', accent: '#ffffff', accent2: '#ffd300', dark: '#9c0020', text: '#ffffff' },
  { id: 'mclaren',  en: 'McLAREN',  body: '#ff8000', accent: '#1a1a1a', accent2: '#47c7fc', dark: '#2b2b2b', text: '#1a1a1a' },
  { id: 'mercedes', en: 'MERCEDES', body: '#16181c', accent: '#00a19c', accent2: '#c0c4c8', dark: '#0a0a0c', text: '#00a19c' },
];
const labelColor = c => ({ redbull: '#e10600', ferrari: '#e8002d', mclaren: '#ff8000', mercedes: '#00a19c' })[c.id];
// 側面 F1 車：地效世代比例（高鼻、側箱下切、寬尾翼）
function carSVG(c) {
  const id = 'g' + c.id;
  return `<svg viewBox="0 0 400 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
    <radialGradient id="${id}t" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></radialGradient>
  </defs>
  <ellipse cx="200" cy="121" rx="178" ry="5" fill="#000" opacity=".55"/>
  <!-- 尾翼 -->
  <rect x="16" y="22" width="5" height="52" rx="1.5" fill="${c.dark}"/>
  <rect x="10" y="30" width="52" height="8" rx="2" fill="${c.body}"/>
  <rect x="12" y="22" width="48" height="6" rx="2" fill="${c.accent}"/>
  <rect x="20" y="68" width="34" height="4" rx="1.5" fill="${c.dark}"/>
  <!-- 底板 -->
  <path d="M34 104 L340 104 L336 110 L40 110 Z" fill="#0b0b0b"/>
  <!-- 懸吊 -->
  <g stroke="#1c1c1c" stroke-width="3" stroke-linecap="round">
    <line x1="68" y1="86" x2="92" y2="78"/><line x1="108" y1="86" x2="92" y2="78"/>
    <line x1="292" y1="84" x2="310" y2="76"/><line x1="332" y1="86" x2="310" y2="76"/>
  </g>
  <!-- 車身主體 -->
  <path d="M40 104 L46 82 C62 62 108 56 150 54 L158 46 Q168 40 178 44 L186 54 L222 60 C282 64 332 74 366 86 L370 96 L300 96 L268 104 Z" fill="${c.body}"/>
  <path d="M40 104 L46 82 C62 62 108 56 150 54 L158 46 Q168 40 178 44 L186 54 L222 60 C282 64 332 74 366 86 L370 96 L300 96 L268 104 Z" fill="url(#${id}b)"/>
  <!-- 引擎蓋鰭片與色條 -->
  <path d="M48 80 C66 62 110 57 150 55 L148 60 C112 62 72 68 52 84 Z" fill="${c.accent}" opacity=".9"/>
  <!-- 側箱（下切） -->
  <path d="M104 74 L214 68 L224 86 L206 104 L126 104 L112 92 Z" fill="${c.dark}"/>
  <path d="M110 78 L212 72 L218 80 L116 86 Z" fill="${c.accent2}" opacity=".9"/>
  <!-- 側箱進氣口 -->
  <path d="M212 68 L226 70 L230 80 L224 86 Z" fill="#050505"/>
  <!-- 座艙與頭枕 -->
  <path d="M186 54 L192 44 L214 46 L222 60 Z" fill="#070707"/>
  <path d="M184 56 L190 52 L196 54 L192 60 Z" fill="${c.dark}"/>
  <!-- 安全帽 -->
  <circle cx="206" cy="51" r="6.5" fill="${c.accent2}"/>
  <path d="M204 49 Q209 47 212 51 L211 54 Q207 53 204 52 Z" fill="#111"/>
  <!-- Halo -->
  <path d="M188 56 Q210 28 240 58" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <line x1="214" y1="40" x2="214" y2="52" stroke="#1a1a1a" stroke-width="4"/>
  <!-- 鼻翼與前翼 -->
  <rect x="300" y="100" width="92" height="6" rx="2" fill="${c.dark}"/>
  <rect x="308" y="93" width="84" height="5" rx="2" fill="${c.accent}"/>
  <rect x="316" y="87" width="72" height="4" rx="2" fill="${c.body}"/>
  <rect x="388" y="82" width="5" height="26" rx="1.5" fill="${c.dark}"/>
  <!-- 車輪 -->
  <g>
    <circle cx="90" cy="94" r="25" fill="url(#${id}t)"/><circle cx="90" cy="94" r="21" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="90" cy="94" r="12" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/><circle cx="90" cy="94" r="4" fill="${c.accent}"/>
    <circle cx="310" cy="94" r="25" fill="url(#${id}t)"/><circle cx="310" cy="94" r="21" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="310" cy="94" r="12" fill="#1f1f1f" stroke="#3a3a3a" stroke-width="2"/><circle cx="310" cy="94" r="4" fill="${c.accent}"/>
  </g>
  <!-- 車隊字樣 -->
  <text x="130" y="100" font-size="10" font-weight="800" letter-spacing="1" fill="${c.text}" font-family="Arial, Helvetica, sans-serif">${c.en}</text>
  </svg>`;
}
// ===== 頒獎台（版本 B）：賽車服顏色跟車隊 =====
// 安全帽配色（只動安全帽，車的顏色不動）
const HELMETS = {
  redbull:  { helm: '#ffffff', stripe: '#e10600' },
  ferrari:  { helm: '#ffd300', stripe: '#ffffff' },
  mclaren:  { helm: '#1e4fd8', stripe: '#e10600' },
  mercedes: { helm: '#00a19c', stripe: '#c0c4c8' },
};
function podiumSVG(tierIdx, c) {
  const SUIT = c.body, { helm: HELM, stripe: STRIPE } = HELMETS[c.id];
  const ACC = c.id === 'mercedes' ? '#c0c4c8' : c.accent === '#ffffff' ? '#ffffff' : c.accent;   // 賽車服胸帶

  const trophy = (x, y, k = 1) => `<g transform="translate(${x},${y}) scale(${k})">

  const helmet = (x, y, tilt = 0) => `<g transform="translate(${x},${y}) rotate(${tilt})">

  const torso = `<path d="M42,54 h36 l6,22 l-4,36 h-40 l-4,-36z" fill="${SUIT}" stroke="${EDGE}" stroke-width="1"/>
    <path d="M40,74 h40 v5 h-40z" fill="${ACC}"/>

  const legsStand = `<path d="M50,110 l-4,40 l-2,38" stroke="${SUIT}" stroke-width="14" stroke-linecap="round" fill="none"/>

  const arm = (d, gx, gy) => `<path d="${d}" stroke="${SUIT}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="${gx}" cy="${gy}" r="5.5" fill="${STRIPE === '#ffffff' ? '#1a1a1a' : STRIPE}"/>`;
  const champagne = `<g><path d="M14,40 l-6,-26" stroke="#2a5c2a" stroke-width="7" stroke-linecap="round"/><path d="M8,14 l-2,-8" stroke="#2a5c2a" stroke-width="4" stroke-linecap="round"/>

  // 站姿：pose = 'champ' 雙手高舉(獎盃+香檳) | 'trophy' 右手舉獎盃 | 'clap' 胸前鼓掌

  const sitting = (x, y, o = {}) => `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)">

  // 躺姿：躺平，一手遮面罩

    <g transform="translate(28,180) rotate(-90)">${helmet(0, 0)}</g>
    <text x="4" y="150" font-size="22" fill="#777" font-family="Arial">z z</text>
  </g>`;
  // 裁判：白襯衫、深褲、帽子、舉牌
  const steward = (x, y, text) => `<g transform="translate(${x},${y}) scale(${K}) translate(-60,-192)">
    <ellipse cx="60" cy="193" rx="24" ry="3.5" fill="#000" opacity=".5"/>
    <path d="M52,110 l-3,40 l-1,38 M68,110 l3,40 l1,38" stroke="#2b2b33" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M40,186 h14 v6 h-16z M70,186 h14 v6 h-16z" fill="#111"/>
    <path d="M44,54 h32 l6,20 l-3,38 h-38 l-3,-38z" fill="#e8e8ea"/>
    <rect x="58" y="56" width="3" height="56" fill="#bbb"/><rect x="41" y="110" width="38" height="5" fill="#222"/>

    <path d="M74,60 l14,10 l6,-24" stroke="#e8e8ea" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="94" cy="44" r="5" fill="#f1c8a0"/>
    <rect x="92" y="-8" width="5" height="50" fill="#999"/>

    <circle cx="60" cy="34" r="13" fill="#f1c8a0"/><path d="M46,30 a14,14 0 0 1 28,0 z" fill="#222"/><rect x="44" y="28" width="32" height="5" rx="2" fill="#222"/>

  const tag = (x, y, text, color = '#3ddc84') => `<g><rect x="${x - 36}" y="${y - 11}" width="72" height="16" rx="8" fill="${color}"/><text x="${x}" y="${y + 1}" font-size="9" font-weight="700" fill="#000" text-anchor="middle">${text}</text></g>`;
  const ground = `<rect x="0" y="150" width="300" height="20" fill="#16161b"/>`;
  const podium = `<g>
      <rect x="62" y="108" width="58" height="42" fill="#2a2a32"/><text x="91" y="128" font-size="16" font-weight="800" fill="#c0c0c0" text-anchor="middle">2</text>

      <rect x="180" y="122" width="58" height="28" fill="#2a2a32"/><text x="209" y="140" font-size="16" font-weight="800" fill="#cd7f32" text-anchor="middle">3</text>
    </g>`;
  const office = `<rect x="6" y="116" width="58" height="34" fill="#1f1f26"/><rect x="4" y="112" width="62" height="5" fill="#3a3a44"/>`;
  let fig = '', note = '';
  switch (tierIdx) {
    case 0: fig = office + sitting(24, 150, { q: true }) + steward(62, 150, 'DSQ'); note = tag(40, -22, '取消資格', '#ff5252'); break;

    case 2: fig = standing(150, 90, 'champ'); note = tag(150, -22, '冠軍'); break;

  return `<svg class="podium" viewBox="0 -40 300 210" xmlns="http://www.w3.org/2000/svg"><defs>${gold}</defs>${ground}${podium}${fig}${note}</svg>`;

// ============ 關卡定義 ============
// 8 級 → 固定分數（所有關卡共用）；前兩級另外標記 DSQ / 調查中
// 每級自帶分數 pts 與標記 flag（dsq 不計分、sus 調查中）；沒有作弊可能的關卡就不設前兩級
const P = (pts, flag = '') => ({ pts, flag });
const fmt = ms => (ms / 1000).toFixed(2);

const STAGES = [

    id: 'start', name: '起跑反應', desc: '五燈熄滅瞬間按下，測純反應時間', better: 'low',

      { ...P(50), min: 300, max: 350, name: '一般人平均', desc: '人類平均反應約 0.30s。' },

    fmtValue: v => `${v} 顆`,
    norm: v => v,
    // 門檻為估計值（Batak 牆面成績扣掉手臂移動換算到手機），待實測校準
    tiers: [
      { ...P(100), min: 34, max: Infinity, name: '金氏紀錄級', desc: 'Button 30 秒 58 顆（0.52s/顆），扣掉手臂移動換算到手機約 0.30s/顆。' },
      { ...P(85), min: 29, max: 34, name: 'F1 頂尖反應', desc: '車隊訓練前段班的水準。' },
      { ...P(70), min: 24, max: 29, name: 'F1 車手水準', desc: '正規車手訓練常見成績。' },
      { ...P(50), min: 20, max: 24, name: '一般人平均', desc: '一般成人用手機實測約 20–23 顆。' },
      { ...P(30), min: 15, max: 20, name: '慢半拍', desc: '看到燈才想動，手還沒跟上。' },
      { ...P(10), min: 0,  max: 15, name: '還在找燈', desc: '多練幾次會進步，這很正常。' },
    ],
    range: t => t.max === Infinity ? `${t.min} 顆以上` : t.min === 0 ? `${t.max - 1} 顆以下` : `${t.min}–${t.max - 1} 顆`,
  },
];
const msToCm = ms => 0.5 * 980 * (ms / 1000) ** 2;
STAGES.push({
  id: 'ruler', name: '接尺測試', desc: '尺垂在拇指與食指之間，掉下來立刻接住', better: 'low',
  fmtValue: v => v >= 293 ? '沒接到' : `${msToCm(v).toFixed(1)} cm`,
  norm: v => Math.round(v),
  // 傳統體測常模：15–20 cm 平均、7.5 cm 以下優秀；手機點擊比真捏尺快一點，整體往快移半級（待實測校準）
  tiers: [
    { ...P(0, 'dsq'), min: 0,   max: 100, name: '超越人類極限', desc: '不到 5 cm，尺還沒掉就按了。' },

    { ...P(100), min: 130, max: 160, name: '金手指', desc: '體測常模「優秀」是 7.5 cm 以下，你在這附近。' },
    { ...P(85), min: 160, max: 190, name: 'F1 車手水準', desc: '12–18 cm，常模「良好」。' },
    { ...P(70), min: 190, max: 220, name: '反應不錯', desc: '18–24 cm，比平均快一點。' },
    { ...P(50), min: 220, max: 260, name: '一般人平均', desc: '成人常模平均約 15–20 cm（真捏尺），手機換算落在這。' },
    { ...P(30), min: 260, max: 293, name: '慢半拍', desc: '尺快掉出手了。' },
    { ...P(10), min: 293, max: Infinity, name: '尺掉地上', desc: '沒接到，再試一次。' },
  ],
  range: t => t.max === Infinity ? '沒接到' : `${msToCm(t.min).toFixed(1)}–${msToCm(t.max).toFixed(1)} cm`,
});
const stageById = id => STAGES.find(s => s.id === id);
function tierIdxOf(stage, v) { const n = stage.norm(v); return stage.tiers.findIndex(t => n >= t.min && n < t.max); }

// ============ 狀態與儲存 ============
let car = null, playerName = '';
let best = {};   // { stageId: { value, tier, points } }
const SAVE_KEY = 'f1check_v1';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ car: car && car.id, playerName, best })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    playerName = d.playerName || ''; best = d.best || {};
    if (d.car) chooseCar(d.car, true);
  } catch (e) {}
}
function recordResult(stage, value) {
  const tier = tierIdxOf(stage, value), points = stage.tiers[tier].pts;
  const cur = best[stage.id];
  const isBetter = !cur || points > cur.points || (points === cur.points && (stage.better === 'low' ? value < cur.value : value > cur.value));
  if (isBetter) best[stage.id] = { value, tier, points };
  save();
  return { tier, points, isBest: isBetter };
}
function totalScore() {
  const played = STAGES.filter(s => best[s.id]);
  if (!played.length) return null;
  return Math.round(played.reduce((a, s) => a + best[s.id].points, 0) / played.length);
}
// 總分 → 頒獎台位置（0 裁判室 DSQ、1 調查中、2 冠軍 … 7 躺平）
function podiumIdx() {
  const flags = STAGES.filter(s => best[s.id]).map(s => s.tiers[best[s.id].tier].flag);
  if (flags.includes('dsq')) return 0;
  if (flags.includes('sus')) return 1;
  const t = totalScore();
  return t >= 90 ? 2 : t >= 80 ? 3 : t >= 65 ? 4 : t >= 45 ? 5 : t >= 25 ? 6 : 7;
}
const PODIUM_NAME = ['取消資格', '裁判審查中', '冠軍', '亞軍', '季軍', '台下鼓掌', '坐地失落', '躺平'];

// ============ 畫面切換 ============
const screens = { menu: 'scrMenu', start: 'scrStart', batak: 'scrBatak', ruler: 'scrRuler', final: 'scrFinal' };
let current = 'menu';
function go(name) {
  stopStart(); stopBatak(); stopRuler();
  Object.values(screens).forEach(id => document.getElementById(id).classList.remove('show'));
  document.getElementById(screens[name]).classList.add('show');
  current = name;
  document.getElementById('h1sub').textContent = name === 'menu' ? '選一關開始' : name === 'final' ? '頒獎台' : stageById(name).name;
  if (name === 'menu') renderMenu();
  if (name === 'final') renderFinal();
  if (name === 'ruler') setupRuler();
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => go('menu')));
function setBackLabel(stageId, text) { const b = document.querySelector(`#${screens[stageId]} [data-back]`); if (b) { b.textContent = text; b.classList.toggle('solid', text !== '回選單'); b.classList.toggle('ghost', text === '回選單'); } }

// ============ 選車 ============
const overlay = document.getElementById('overlay');
document.getElementById('cars').innerHTML = CARS.map(c =>
  `<div class="car" data-id="${c.id}" style="--c:${labelColor(c)}">${carSVG(c)}<div class="nm">${c.en}</div></div>`).join('');
document.querySelectorAll('.car').forEach(el => el.addEventListener('click', () => chooseCar(el.dataset.id)));
function chooseCar(id, silent) {
  car = CARS.find(c => c.id === id);
  overlay.classList.add('hide');
  document.getElementById('mycar').innerHTML = `${carSVG(car)}<div><b style="color:${labelColor(car)}">${car.en}</b><br><a class="linkbtn" id="changeCar">換車</a></div>`;
  document.getElementById('changeCar').addEventListener('click', () => { go('menu'); overlay.classList.remove('hide'); });
  if (!silent) { save(); go('menu'); }
}

// ============ 關卡選單 ============
function renderMenu() {
  document.getElementById('stages').innerHTML = STAGES.map(s => {
    const b = best[s.id];
    const sb = b ? `<b>${b.points} 分</b><span class="tn">${s.fmtValue(b.value)}・${s.tiers[b.tier].name}</span>` : `<span class="tn">未挑戰</span>`;
    return `<div class="stage" data-stage="${s.id}"><div class="sn">${s.name}</div><div class="sd">${s.desc}</div><div class="sb">${sb}</div></div>`;
  }).join('');
  document.querySelectorAll('.stage').forEach(el => el.addEventListener('click', () => go(el.dataset.stage)));
  const t = totalScore();
  document.getElementById('totalScore').textContent = t == null ? '--' : t;

const cols = [...document.querySelectorAll('.col')];

const statusBatak = document.getElementById('statusBatak');
const STG_BATAK = stageById('batak');
const BATAK_SEC = 10;
let bState = 'idle', bTimers = [], bLit = -1, bHits = 0, bMiss = 0, bEnd = 0, bRaf = 0;
function hud() { document.getElementById('bkHits').textContent = bHits; document.getElementById('bkMiss').textContent = bMiss; }
function stopBatak() { setBackLabel('batak', '回選單'); board.classList.remove('live'); bTimers.forEach(clearTimeout); bTimers = []; cancelAnimationFrame(bRaf); cells.forEach(c => c.className = 'cell'); bLit = -1; bState = 'idle'; bHits = 0; bMiss = 0; hud(); document.getElementById('bkTime').textContent = BATAK_SEC.toFixed(1); statusBatak.innerHTML = '<span class="dim">按紅鍵開始，10 秒內點掉亮起的燈</span>'; renderLadder(STG_BATAK, 'ladderBatak', null); }

      document.getElementById('bkTime').textContent = (left / 1000).toFixed(1);
      if (left <= 0) { finishBatak(); return; }

}
function finishBatak() {
  SFX.go();

  const r = recordResult(STG_BATAK, bHits);

}
const rstage = document.getElementById('rstage'), rruler = document.getElementById('rruler'), rmsg = document.getElementById('rmsg'), rglove = document.getElementById('rglove'), statusRuler = document.getElementById('statusRuler');
const STG_RULER = stageById('ruler'), R_PX_CM = 5.2, R_G = 980, R_MAX_CM = 42, R_H = 232, R_SINK = 22;   // 尺高 = 42cm×5.2 + 14px 尺頭留白；尺底插進虎口 22px
const R_GW = 240, R_SCALE = R_GW / 270;   // 手套寬度與 viewBox 比例（位置用公式算，不量 DOM，iOS 才準）
let rState = 'idle', rT0 = 0, rRaf = 0, rTimer = 0, rTop0 = -R_H;
for (let cm = 0; cm <= R_MAX_CM; cm++) {
  const i = document.createElement('i'); i.style.bottom = (cm * R_PX_CM) + 'px'; i.style.width = cm % 5 === 0 ? '18px' : '9px'; rruler.appendChild(i);
  if (cm % 5 === 0 && cm > 0) { const b = document.createElement('b'); b.style.bottom = (cm * R_PX_CM) + 'px'; b.textContent = cm; rruler.appendChild(b); }
}
function setupRuler() {
  rglove.innerHTML = gloveSVG(car);
  // 拇指尖在旋轉後的 viewBox 座標 (146,30)；手套左緣 = 區塊中心 - 110
  const stW = rstage.clientWidth, stH = rstage.clientHeight;
  const tipX = stW / 2 - 110 + 136 * R_SCALE, tipY = stH - 240 * R_SCALE + 34 * R_SCALE;
  rruler.style.left = (tipX + 2) + 'px';
  rTop0 = tipY + R_SINK - R_H;
  rruler.style.top = rTop0 + 'px';
}
function stopRuler() {
  cancelAnimationFrame(rRaf); clearTimeout(rTimer); rState = 'idle'; rstage.classList.remove('done'); rstage.classList.remove('live');
  rruler.style.top = rTop0 + 'px'; rmsg.textContent = '按紅鍵準備，尺掉下來立刻點畫面';
  document.getElementById('rkCm').textContent = '--'; document.getElementById('rkSec').textContent = '--';
  statusRuler.innerHTML = '<span class="dim">按紅鍵準備，尺掉下來立刻點畫面或按紅鍵</span>';
  setBackLabel('ruler', '回選單'); renderLadder(STG_RULER, 'ladderRuler', null);
}
function armRuler() {
  stopRuler(); rState = 'armed'; rstage.classList.add('live'); rmsg.textContent = '準備…尺隨時會掉';
  rTimer = setTimeout(() => {
    rState = 'falling'; rT0 = performance.now(); rmsg.textContent = ''; SFX.whoosh();
    const loop = () => {
      const t = (performance.now() - rT0) / 1000, d = 0.5 * R_G * t * t;

      rRaf = requestAnimationFrame(loop);
    };
    rRaf = requestAnimationFrame(loop);
  }, 1000 + Math.random() * 2500);
}
function finishRuler(ms) {
  cancelAnimationFrame(rRaf); rState = 'result'; rstage.classList.add('done'); rstage.classList.remove('live'); rmsg.textContent = '';
  if (ms >= 293) SFX.thud(); else SFX.snap();
  const r = recordResult(STG_RULER, ms);
  const cm = msToCm(ms);
  document.getElementById('rkCm').textContent = ms >= 293 ? '--' : cm.toFixed(1) + ' cm';
  document.getElementById('rkSec').textContent = ms >= 293 ? '--' : (ms / 1000).toFixed(3) + ' s';
  statusRuler.innerHTML = stageResultHTML(STG_RULER, ms, r, ms < 160 ? 'ok' : ms < 220 ? '' : 'bad');
  renderLadder(STG_RULER, 'ladderRuler', ms);
}
function pressRuler() {
  if (!car) return;

  if (rState === 'armed') { SFX.buzz(); stopRuler(); rState = 'result'; rstage.classList.remove('live'); rstage.classList.add('done'); statusRuler.innerHTML = '<span class="bad">太早了！</span><br><span class="dim">尺還沒掉就按。再按紅鍵重來</span>'; return; }
  if (rState === 'falling') finishRuler(Math.round(performance.now() - rT0));
}

// 紅鍵：pointerdown 觸發（比 click 早），滑動畫面不會誤觸
function wireRedButton(btn, fn) {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('down'); fn(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove('down')));
  btn.addEventListener('click', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') e.preventDefault(); });
}
window.addEventListener('keydown', e => {
  if (e.repeat || e.target.tagName === 'INPUT') return;

// ============ 成績卡（1080×1920 直式） ============
async function drawCard() {
  const W = 1080, H = 1920, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const font = '"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif';
  const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
  const loadSVG = svg => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const total = totalScore(), p = podiumIdx();

  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#111116'); bg.addColorStop(1, '#07070a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  g.textAlign = 'center'; g.fillStyle = '#9a9aa2'; g.font = `600 40px ${font}`;
  g.fillText('F1 車手體檢', W / 2, 120);

  // 燈架全亮
  const gx = 110, gy = 160, gw = W - 220, gh = 250;
  g.fillStyle = '#1a1a1f'; rr(gx, gy, gw, gh, 24); g.fill(); g.strokeStyle = '#2c2c33'; g.lineWidth = 3; g.stroke();
  const lampR = 42, colGap = gw / 5;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 2; j++) {
    const x = gx + colGap * (i + 0.5), y = gy + 72 + j * 106;
    g.save(); g.shadowColor = '#ff1e1e'; g.shadowBlur = 50; g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.fillStyle = '#ff1e1e'; g.fill(); g.restore();
    g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.lineWidth = 5; g.strokeStyle = '#111'; g.stroke();
    const hl = g.createRadialGradient(x - 14, y - 16, 3, x, y, lampR); hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.beginPath(); g.arc(x, y, lampR, 0, Math.PI * 2); g.fillStyle = hl; g.fill();
  }
  // 賽車
  const carImg = await loadSVG(carSVG(car));
  const cw = 680, ch = cw * 128 / 400; g.drawImage(carImg, (W - cw) / 2, 440, cw, ch);
  // 頒獎台
  const podImg = await loadSVG(podiumSVG(p, car).replace(' class="podium"', ''));
  const pw = 640, ph = pw * 210 / 300;
  rr((W - pw) / 2 - 16, 670 - 12, pw + 32, ph + 24, 20); g.fillStyle = '#0f0f13'; g.fill();
  g.drawImage(podImg, (W - pw) / 2, 670, pw, ph);
  // 名字 · 車隊
  g.fillStyle = '#fff'; g.font = `700 56px ${font}`; g.fillText(playerName, W / 2, 1210);
  g.fillStyle = labelColor(car); g.font = `800 40px ${font}`; g.fillText(car.en, W / 2, 1262);
  // 總分
  g.fillStyle = total >= 80 ? '#3ddc84' : total >= 45 ? '#ffffff' : '#ff5252'; g.font = `800 190px ${font}`;
  g.fillText(`${total}`, W / 2, 1450);
  g.fillStyle = '#8a8a92'; g.font = `600 36px ${font}`; g.fillText('總分', W / 2 + 190, 1450);
  g.fillStyle = '#3ddc84'; g.font = `700 56px ${font}`; g.fillText(PODIUM_NAME[p], W / 2, 1535);
  // 各關分項
  const rows = STAGES.map(s => best[s.id] ? [s.name, `${s.fmtValue(best[s.id].value)}　${s.tiers[best[s.id].tier].name}`, `${best[s.id].points} 分`] : [s.name, '未挑戰', '--']);
  const by = 1600, bh = 70 * rows.length + 30;
  rr(100, by, W - 200, bh, 22); g.fillStyle = '#15151a'; g.fill();
  rows.forEach(([n, v, pts], i) => {
    const y = by + 50 + i * 70;
    g.textAlign = 'left'; g.fillStyle = '#ddd'; g.font = `700 32px ${font}`; g.fillText(n, 140, y);
    g.textAlign = 'center'; g.fillStyle = '#aaa'; g.font = `30px ${font}`; g.fillText(v, W / 2 + 40, y);
    g.textAlign = 'right'; g.fillStyle = '#3ddc84'; g.font = `700 34px ${font}`; g.fillText(pts, W - 140, y);
  });
  // 日期與署名
  g.textAlign = 'left'; g.fillStyle = '#55555c'; g.font = `24px ${font}`;
  g.fillText(new Date().toLocaleString('zh-TW', { hour12: false }), 90, H - 50);
  g.textAlign = 'right'; g.font = `22px ${font}`; g.fillText('Generated by Gary Fan', W - 90, H - 50);
  return c;
}
async function shareResult() {

  paint();
  btn.addEventListener('click', e => { e.stopPropagation(); muted = !muted; try { localStorage.setItem('f1check_mute', muted ? '1' : '0'); } catch (x) {} paint(); if (!muted) tone(880, .08); });
  function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); return ctx; }
  // 手機要先有使用者手勢才能出聲：任何 pointerdown 先把 context 叫醒
  window.addEventListener('pointerdown', () => { if (!muted) ac(); }, { passive: true });
  const env = (g, t0, a, d, peak = .5) => { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.001, t0 + a + d); };
  function tone(freq, dur, type = 'square', peak = .25, slideTo = null) {
    if (muted) return; const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    env(g, t, .005, dur, peak); o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, fromHz, toHz, peak = .3) {
    if (muted) return; const c = ac(), t = c.currentTime, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(fromHz, t); f.frequency.exponentialRampToValueAtTime(toHz, t + dur);
    const g = c.createGain(); env(g, t, .01, dur, peak); src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  // 引擎拉轉：鋸齒波低頻往上掃＋諧波＋噪音，像 V6 暖胎起步
  function rev(dur = 1.1, from = 70, to = 420, lpTo = 3200, lpFrom = 600) {
    if (muted) return; const c = ac(), t = c.currentTime, g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.setValueAtTime(lpFrom, t); f.frequency.exponentialRampToValueAtTime(lpTo, t + dur);
    [1, 2, 3].forEach((h, i) => { const o = c.createOscillator(); o.type = i === 0 ? 'sawtooth' : 'square';
      o.frequency.setValueAtTime(from * h, t); o.frequency.exponentialRampToValueAtTime(to * h, t + dur * .85); o.frequency.exponentialRampToValueAtTime(to * h * .7, t + dur + .3);
      const og = c.createGain(); og.gain.value = i === 0 ? .5 : .18 / h; o.connect(og).connect(f); o.start(t); o.stop(t + dur + .4); });
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .08); g.gain.setValueAtTime(.35, t + dur); g.gain.exponentialRampToValueAtTime(.001, t + dur + .4);
    f.connect(g).connect(c.destination); noise(dur + .3, 400, 2500, .08);
  }
  // 起步：連拉兩次再收尾。兩個略失諧的鋸齒波疊厚，低通跟著轉速走，不加噪音
  function launch() {
    if (muted) return; const c = ac(), t = c.currentTime;
    const pts = [[0, 80], [.45, 320], [.75, 150], [1.15, 380], [1.5, 220], [2.4, 70]];   // [秒, Hz]
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
    const g = c.createGain();
    [0, 6].forEach(detune => {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.detune.value = detune;
      o.frequency.setValueAtTime(pts[0][1], t);
      pts.slice(1).forEach(([dt, hz]) => o.frequency.exponentialRampToValueAtTime(hz, t + dt));
      const og = c.createGain(); og.gain.value = .45; o.connect(og).connect(f); o.start(t); o.stop(t + 2.6);
    });
    f.frequency.setValueAtTime(pts[0][1] * 5, t);
    pts.slice(1).forEach(([dt, hz]) => f.frequency.exponentialRampToValueAtTime(hz * 5, t + dt));
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .06); g.gain.setValueAtTime(.32, t + 1.6); g.gain.exponentialRampToValueAtTime(.001, t + 2.5);
    f.connect(g).connect(c.destination);
  }
  return {
    lamp:   () => tone(1100, .09, 'square', .2),                 // 起跑燈每亮一組
    rev:    () => rev(),                                          // 紅鍵：引擎拉轉
    launch,                                                       // 熄燈後按下：連拉兩次再收尾
    buzz:   () => tone(110, .45, 'sawtooth', .3, 70),             // 偷跑／太早
    beep:   () => tone(660, .12, 'square', .22),                  // 倒數 3-2-1
    go:     () => tone(1320, .25, 'square', .25),                 // GO
    hit:    () => tone(1500, .05, 'square', .2, 900),             // 燈板點中「嗒」
    miss:   () => tone(160, .12, 'triangle', .25, 90),            // 誤點「噗」
    whoosh: () => noise(.45, 3000, 600, .25),                     // 尺落下「咻」
    snap:   () => { tone(2200, .04, 'square', .25, 600); noise(.06, 2000, 800, .3); },  // 接住「啪」
    thud:   () => tone(120, .25, 'triangle', .3, 60),             // 沒接到
    fanfare:() => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, i === 3 ? .5 : .16, 'square', .22), i * 150)),
    sad:    () => [392, 349, 311].forEach((f, i) => setTimeout(() => tone(f, i === 2 ? .6 : .25, 'triangle', .25), i * 260)),
  };
})();

// ============ 啟動 ============
renderLadder(STG_START, 'ladderStart', null);
renderLadder(STG_BATAK, 'ladderBatak', null);
renderLadder(STG_RULER, 'ladderRuler', null);
load();
go('menu');
</script>
